<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>ClearPath</title>

<!-- PWA · install + offline -->
<link rel="manifest" href="manifest.webmanifest"/>
<meta name="theme-color" content="#a25c3f"/>
<meta name="description" content="A private, on-device companion for 12-step inventory work."/>

<!-- iOS-specific home-screen install hints -->
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="ClearPath"/>
<meta name="mobile-web-app-capable" content="yes"/>
<link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png"/>

<!-- Browser-tab favicon -->
<link rel="icon" href="favicon.ico" sizes="any"/>
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png"/>
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png"/>

<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..700&family=Geist:wght@300..700&family=Geist+Mono:wght@300..700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="paper-ink.css"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:var(--app-frame,#e8e3da);}
body{display:flex;justify-content:center;}
/* When installed as standalone PWA, paint the viewport with the active theme's
   frame tone so the translucent iOS status bar matches the app, not white. */
@media (display-mode:standalone){
  html,body{ background:var(--app-frame,#f4eee4); }
}
:root:not([data-theme="paper"]):not([data-theme="dusk"]) { --app-frame:#e8e3da; }
@media (display-mode:standalone){
  :root:not([data-theme="paper"]):not([data-theme="dusk"]) { --app-frame:#f4eee4; }
}
input,textarea,button{font-family:inherit;color:inherit;}
textarea{box-sizing:border-box;width:100%;}
h1,h2,h3,h4{font-weight:400;}

/* ── RESPONSIVE SHELL ── */

/* Phone default: centered narrow card */
.sw-outer{
  min-height:100vh;width:100%;
  background:var(--app-frame,#e8e3da);
  display:flex;justify-content:center;align-items:stretch;
}
.sw-card{
  width:100%;max-width:430px;min-height:100vh;
  position:relative;overflow:hidden;
  box-shadow:0 0 0 1px rgba(60,40,20,0.08),0 30px 80px rgba(60,40,20,0.12);
  display:flex;flex-direction:column;
}

/* TabBar visible on phone, hidden on tablet+ */
.sw-tabbar{ display:block; }
.sw-sidebar{ display:none; }

/* ≥ 600px: sidebar layout (catches iPad Split View narrow column too) */
@media (min-width:600px){
  html,body{ background:#efe9de; }
  .sw-outer{
    background:#efe9de;
    justify-content:flex-start;
    align-items:flex-start;
  }
  .sw-card{
    flex-direction:row;
    max-width:none;
    width:100%;
    min-height:100vh;
    box-shadow:none;
    border-radius:0;
  }
  .sw-tabbar{ display:none !important; }
  .sw-sidebar{ display:flex; }
  .sw-content{
    flex:1;
    min-width:0;          /* allow the content column to shrink instead of forcing
                             inner text to its min-content width (one word per line).
                             Root cause of the B3 "pinched cause column" bug. */
    max-width:760px;
    display:flex;
    flex-direction:column;
    min-height:100vh;
    border-left:1px solid var(--rule);
  }
}

/* 600–767px: compact sidebar so the content column still has room (Split View) */
@media (min-width:600px) and (max-width:767px){
  .sw-sidebar{ width:200px !important; }
}

/* ≥ 1200px: wider sidebar */
@media (min-width:1200px){
  .sw-sidebar{ width:280px !important; }
  .sw-content{ max-width:820px; }
}

/* ≥ 1440px: page-on-desk — outer margin + hairline */
@media (min-width:1440px){
  .sw-outer{
    padding:32px;
    align-items:flex-start;
    justify-content:center;
  }
  .sw-card{
    border-radius:12px;
    border:1px solid var(--rule);
    overflow:hidden;
    min-height:calc(100vh - 64px);
    box-shadow:0 2px 8px rgba(60,40,20,0.06);
  }
}
</style>
</head>

<div id="root"></div>

/* Derive a section's real status from the user's data + any explicit override.
   Returns 'done' | 'progress' | 'undone'. Shared by Home ("Continue" card) and
   the Steps overview so both reflect actual progress rather than static sample
   status. The "next section to work" is the first section that is NOT done. */
function inferSectionStatus(steps, id){
  const override=(steps.sectionStatus||{})[id];
  if(override) return override;
  if(id==='lists'  && steps.resentments.length>0) return 'progress';
  if(id==='causes' && steps.causes.length>0)      return 'progress';
  if(id==='faults' && steps.faults.length>0)      return 'progress';
  if(id==='fear1'  && steps.fears.length>0)        return 'progress';
  if(id==='fear2'  && steps.fear2 && Object.values(steps.fear2).some(q=>q&&Object.keys(q).length>0)) return 'progress';
  if(id==='sex'    && steps.sexRelations && steps.sexRelations.length>0) return 'progress';
  if(id==='defects'&& steps.defects && steps.defects.length>0) return 'progress';
  if(id==='eighth' && steps.amends.length>0)      return 'progress';
  return 'undone';
}
/* The section the user should continue with = the first one not yet marked done. */
function firstUnfinishedSection(steps){
  return STEP_SECTIONS.find(s=>inferSectionStatus(steps,s.id)!=='done') || STEP_SECTIONS[STEP_SECTIONS.length-1];
}

const NavContext = createContext(null);
function useNav(){ return useContext(NavContext); }

function NavProvider({children}){
  const [tab,setTab] = useState('home');
  const [stacks,setStacks] = useState({
    home:['home'], steps:['overview'], meet:['list'], people:['list'], more:['root'],
  });
  const switchTab = useCallback((next)=>{
    if(next===tab) setStacks(s=>({...s,[next]:[s[next][0]]}));
    else setTab(next);
  },[tab]);
  const push = useCallback((screen,params)=>{
    setStacks(s=>{const top=s[tab].slice(); top.push(params?{screen,params}:screen); return{...s,[tab]:top};});
  },[tab]);
  const back = useCallback(()=>{
    setStacks(s=>{const top=s[tab].slice(); if(top.length>1)top.pop(); return{...s,[tab]:top};});
  },[tab]);
  const goto = useCallback((nextTab,screen,params)=>{
    setTab(nextTab);
    setStacks(s=>({...s,[nextTab]:[s[nextTab][0],params?{screen,params}:screen].filter((v,i,a)=>i===0||(typeof v==='string'?v!==a[0]:true))}));
  },[]);
  const currentStack=stacks[tab];
  const currentEntry=currentStack[currentStack.length-1];
  const current=typeof currentEntry==='string'?currentEntry:currentEntry.screen;
  const params=typeof currentEntry==='string'?{}:currentEntry.params;
  const canBack=currentStack.length>1;
  return (
    <NavContext.Provider value={{tab,current,params,canBack,switchTab,push,back,goto}}>
      {children}
    </NavContext.Provider>
  );
}

/** Days sober from a sobriety date string (ISO or human). Returns 0 if invalid/missing. */
function computeSoberDays(dateStr){
  if(!dateStr) return 0;
  const d = new Date(dateStr);
  if(isNaN(d.getTime())) return 0;
  const diff = Math.floor((Date.now() - d.getTime())/(1000*60*60*24));
  return Math.max(0, diff);
}

/** First letter for avatars; falls back to a dot. */
function profileInitial(name){
  return (name||'').replace(/[^A-Za-z]/g,'')[0] || '·';
}

/** Display name; falls back to a neutral placeholder. */
function displayName(p){ return p && p.name ? p.name : 'You'; }

/** Friendly date for "since …" labels. */
function formatSinceDate(dateStr){
  if(!dateStr) return '';
  const d = new Date(dateStr);
  if(isNaN(d.getTime())) return dateStr;
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
}

/** to24h(7,0,'PM') -> {h:19,m:0} */
function to24h(h, m, ampm){
  let hh = parseInt(h,10) || 0;
  if(ampm==='PM' && hh<12) hh+=12;
  if(ampm==='AM' && hh===12) hh=0;
  return {h:hh, m: parseInt(m,10)||0};
}
function fmt12h(h, m, ampm){
  const mm = String(parseInt(m,10)||0).padStart(2,'0');
  return `${parseInt(h,10)||12}:${mm} ${ampm}`;
}

/** Next occurrence Date for a weekly meeting at given hour/min on given weekdays.
   A meeting that has already STARTED but not yet ENDED still counts as the current/
   next occurrence — it only rolls forward to the following week once it has finished
   (start time + duration). This keeps an in-progress meeting in the "next" slot
   instead of vanishing at its start time. (B4) */
function nextOccurrence(meeting){
  if(!meeting.weekdays || meeting.weekdays.length===0) return null;
  const {h,m} = to24h(meeting.hour, meeting.minute, meeting.ampm);
  const durationMs = (parseInt(meeting.duration,10)||60) * 60000;
  const now = new Date();
  for(let i=0;i<8;i++){
    const d = new Date(now);
    d.setDate(now.getDate()+i);
    d.setHours(h, m, 0, 0);
    // Keep the occurrence while it is still running: end time (start + duration)
    // must be in the future, rather than the start time.
    if(meeting.weekdays.includes(d.getDay()) && (d.getTime() + durationMs) > now.getTime()){
      return d;
    }
  }
  return null;
}
function weekdayBadge(weekdays){
  if(!weekdays || weekdays.length===0) return '—';
  if(weekdays.length===7) return 'Daily';
  return weekdays.slice().sort().map(d=>DAYS_SHORT[d]).join('·');
}

/** The "practice day key" — accounts for the configurable reset hour.
 *  If reset is 04:00, then 02:30 AM still belongs to yesterday's key. */
function practiceDayKey(resetHour=4, resetMinute=0, now=new Date()){
  const d = new Date(now);
  // Subtract the reset offset; the resulting calendar date is today's key.
  d.setHours(d.getHours() - resetHour);
  d.setMinutes(d.getMinutes() - resetMinute);
  const yyyy = d.getFullYear();
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const dd = String(d.getDate()).padStart(2,'0');
  return `${yyyy}-${mm}-${dd}`;
}

function DailyProvider({children}){
  const [daily, setDailyState] = useState(loadDaily);
  /** Patch a single day's entry. dayKey is YYYY-MM-DD. */
  const updateDay = useCallback((dayKey, patch)=>{
    setDailyState(prev=>{
      const cur = prev[dayKey] || { intention:'', morningChecks:[], eveningChecks:{}, eveningNotes:'' };
      const next = { ...prev, [dayKey]: { ...cur, ...patch } };
      saveDaily(next);
      return next;
    });
  },[]);
  /** Toggle a single morning-prayer index for a day. */
  const toggleMorning = useCallback((dayKey, idx)=>{
    setDailyState(prev=>{
      const cur = prev[dayKey] || { intention:'', morningChecks:[], eveningChecks:{}, eveningNotes:'' };
      const set = new Set(cur.morningChecks||[]);
      if(set.has(idx)) set.delete(idx); else set.add(idx);
      const next = { ...prev, [dayKey]: { ...cur, morningChecks:[...set].sort((a,b)=>a-b) } };
      saveDaily(next);
      return next;
    });
  },[]);
  /** Toggle a single evening-review index. */
  const toggleEvening = useCallback((dayKey, idx)=>{
    setDailyState(prev=>{
      const cur = prev[dayKey] || { intention:'', morningChecks:[], eveningChecks:{}, eveningNotes:'' };
      const checks = { ...(cur.eveningChecks||{}) };
      checks[idx] = !checks[idx];
      const next = { ...prev, [dayKey]: { ...cur, eveningChecks: checks } };
      saveDaily(next);
      return next;
    });
  },[]);
  const removeDay = useCallback((dayKey)=>{
    setDailyState(prev=>{ const next = { ...prev }; delete next[dayKey]; saveDaily(next); return next; });
  },[]);
  return (
    <DailyContext.Provider value={{daily, updateDay, toggleMorning, toggleEvening, removeDay}}>
      {children}
    </DailyContext.Provider>
  );
}

function StepsProvider({children}){
  const [steps, setStepsState] = useState(loadSteps);
  const update = useCallback((patch)=>{
    setStepsState(prev=>{ const next = { ...prev, ...patch }; saveSteps(next); return next; });
  },[]);
  /** Add an item to one of the array fields. Returns the new id. */
  const addItem = useCallback((field, item)=>{
    const id = uid(field.slice(0,1));
    setStepsState(prev=>{
      const next = { ...prev, [field]: [...(prev[field]||[]), { id, ...item }] };
      saveSteps(next);
      return next;
    });
    return id;
  },[]);
  /** Bulk add — used by the multi-row resentment add screen. */
  const addItems = useCallback((field, items)=>{
    setStepsState(prev=>{
      const stamped = items.map(it=>({ id: uid(field.slice(0,1)), ...it }));
      const next = { ...prev, [field]: [...(prev[field]||[]), ...stamped] };
      saveSteps(next);
      return next;
    });
  },[]);
  const updateItem = useCallback((field, id, patch)=>{
    setStepsState(prev=>{
      const next = { ...prev, [field]: prev[field].map(x=>x.id===id?{...x,...patch}:x) };
      saveSteps(next);
      return next;
    });
  },[]);
  const removeItem = useCallback((field, id)=>{
    setStepsState(prev=>{
      const next = { ...prev, [field]: prev[field].filter(x=>x.id!==id) };
      // Preserve downstream work (merge, never delete): if a cause is removed we
      // KEEP any fault/fear rows keyed to it. Those screens flag them as
      // "source cause removed" so the written inventory is never silently lost.
      saveSteps(next);
      return next;

  const setSectionStatus = useCallback((sectionId, status)=>{
    setStepsState(prev=>{
      const next = { ...prev, sectionStatus: { ...(prev.sectionStatus||{}), [sectionId]: status } };
      saveSteps(next);
      return next;

  },[]);
  return (
    <StepsContext.Provider value={{steps, update, addItem, addItems, updateItem, removeItem, setSectionStatus}}>
      {children}
    </StepsContext.Provider>
  );
}

function UISettingsProvider({children}){

    setUIState(prev=>{
      const next = { ...prev, ...patch };
      saveUISettings(next);
      return next;
    });
  },[]);
  // Persist the one-time theme migration (loadUISettings may have re-mapped the
  // legacy 'paper' value to 'parchment'); write it back so it sticks.
  useEffect(()=>{ saveUISettings(ui); },[]); // eslint-disable-line react-hooks/exhaustive-deps
  // Apply type-size scale as a CSS variable on documentElement.
  useEffect(()=>{
    const scale = ui.typeSize==='small'?0.92:ui.typeSize==='large'?1.10:1.00;
    document.documentElement.style.setProperty('--type-scale', scale);
    document.documentElement.style.fontSize = `${Math.round(16*scale)}px`;
  },[ui.typeSize]);
  // Apply the color theme by setting data-theme on <html>; CSS variable overrides
  // for 'paper' (white) and 'dusk' (dark) live in paper-ink.css. 'parchment' = :root.
  useEffect(()=>{
    const t = (ui.theme==='paper'||ui.theme==='dusk') ? ui.theme : 'parchment';
    document.documentElement.setAttribute('data-theme', t);
    const meta = document.querySelector('meta[name="theme-color"]');
    if(meta){
      const c = t==='dusk' ? '#1a1722' : t==='paper' ? '#ffffff' : '#a25c3f';
      meta.setAttribute('content', c);
    }
  },[ui.theme]);
  return (
    <UISettingsContext.Provider value={{ui, setUI}}>
      {children}
    </UISettingsContext.Provider>
  );
}

/** Resolve the user's chosen term for the Higher Power.
   IMPORTANT: this only ever substitutes inside APP-AUTHORED text (prompts, prayers,
   questions, instructions). Big Book / 12&12 QUOTATIONS are rendered verbatim and
   must never be passed through this function — out of respect for the source
   literature and its copyright. */
function resolveHigherPower(ui){
  const mode = ui && ui.spiritualLanguage;
  if(mode==='god')    return 'God';
  if(mode==='hashem') return 'Hashem';
  if(mode==='allah')  return 'Allah';
  if(mode==='none')   return 'the source within';
  if(mode==='custom'){ const c=(ui.customHigherPower||'').trim(); return c || 'Higher Power'; }
  return 'Higher Power'; // 'hp' (default) = leave as written
}
/** Swap the "Higher Power" token in app-authored text for the user's chosen term.
   Accepts the ui settings object. Preserves a leading lowercase "higher power"
   occurrence with a lowercased term (except proper names, which stay capitalized). */
function applySpiritualLanguage(text, ui){
  if(!text) return text;
  const term = resolveHigherPower(ui);
  if(term === 'Higher Power') return text; // no-op for 'hp'
  // Proper names (God, Hashem, Allah) keep their capitalization even mid-sentence;
  // descriptive phrases ('the source within') lowercase when replacing 'higher power'.
  const isProperName = /^[A-Z][a-z]/.test(term) && !term.includes(' ');
  const lowerTerm = isProperName ? term : term.charAt(0).toLowerCase()+term.slice(1);
  return text.replace(/\bHigher Power\b/g, term).replace(/\bhigher power\b/g, lowerTerm);
}

/* ── PIN LOCK ── */
const PIN_KEY = 'sw_pin';      // { hash, salt, question, answerHash }
const PIN_VERSION = 1;

async function sha256(str){
  const buf = new TextEncoder().encode(str);
  const hash = await crypto.subtle.digest('SHA-256', buf);
  return Array.from(new Uint8Array(hash)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function randomSalt(){
  const arr = new Uint8Array(16);
  crypto.getRandomValues(arr);
  return Array.from(arr).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function loadPin(){
  try{ const s=localStorage.getItem(PIN_KEY); return s?JSON.parse(s):null; }
  catch{ return null; }
}
function savePin(o){ try{ localStorage.setItem(PIN_KEY, JSON.stringify(o)); }catch{} }

/* ── BACKUP CRYPTO (AES-GCM, key derived from PIN via PBKDF2) ── */
const BACKUP_VERSION = 1;
const BACKUP_STORE_KEYS = [PROFILE_KEY, CONTACTS_KEY, MEETINGS_KEY, PRACTICE_KEY, DAILY_KEY, STEPS_KEY, READINGS_KEY, REMINDERS_KEY, UI_SETTINGS_KEY];
const BACKUP_HISTORY_KEY = 'sw_backup_history';

async function deriveBackupKey(pin, salt){
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey('raw', enc.encode(pin), {name:'PBKDF2'}, false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name:'PBKDF2', salt: enc.encode(salt), iterations: 250000, hash:'SHA-256' },
    base,
    { name:'AES-GCM', length:256 },
    false,
    ['encrypt','decrypt']
  );
}

async function encryptBackup(pin){
  const stored = loadPin();
  if(!stored) throw new Error('Set a PIN before exporting a backup.');
  const data = {};
  BACKUP_STORE_KEYS.forEach(k=>{
    const v = localStorage.getItem(k);
    if(v!==null) data[k] = v;
  });
  const plaintext = new TextEncoder().encode(JSON.stringify(data));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const salt = stored.salt; // reuse PIN salt so import knows how to derive
  const key = await deriveBackupKey(pin, salt);
  const cipher = new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, plaintext));
  const b64 = (bytes)=>btoa(String.fromCharCode(...bytes));
  return {
    version: BACKUP_VERSION,
    created: new Date().toISOString(),
    salt,
    iv: b64(iv),
    cipher: b64(cipher),
  };
}

async function decryptBackup(blob, pin){
  if(!blob || !blob.cipher || !blob.iv || !blob.salt) throw new Error('Not a valid Step Work backup.');
  const fromB64 = (s)=>Uint8Array.from(atob(s), c=>c.charCodeAt(0));
  const key = await deriveBackupKey(pin, blob.salt);
  let plaintext;
  try{
    plaintext = await crypto.subtle.decrypt({name:'AES-GCM', iv:fromB64(blob.iv)}, key, fromB64(blob.cipher));
  }catch(e){ throw new Error('Wrong PIN or corrupted file.'); }
  const obj = JSON.parse(new TextDecoder().decode(plaintext));
  return obj;
}

function recordBackup(name, sizeBytes){
  try{
    const list = JSON.parse(localStorage.getItem(BACKUP_HISTORY_KEY)||'[]');
    list.unshift({name, when:new Date().toISOString(), bytes:sizeBytes});
    localStorage.setItem(BACKUP_HISTORY_KEY, JSON.stringify(list.slice(0,8)));
  }catch{}
}
function loadBackupHistory(){
  try{ return JSON.parse(localStorage.getItem(BACKUP_HISTORY_KEY)||'[]'); }catch{ return []; }
}

/* ── SPONSOR SHARE CRYPTO (F6) ──
   Reuses deriveBackupKey (PBKDF2 250k → AES-GCM-256). Unlike a device backup,
   each share is locked with a fresh random one-time key (not the user's PIN),
   so the sponsor never needs the sponsee's PIN. The encrypted "box" travels by
   any channel; the key travels separately (QR in person / short code remote). */
const SHARE_VERSION = 1;
const SHARE_ALPHABET = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'; // no 0/O/1/I/L — safe to read aloud
const SHARE_STEP_SECTIONS = [
  {id:'resentments', label:'Resentments'},
  {id:'causes',      label:'Causes & effects'},
  {id:'faults',      label:'Our faults'},
  {id:'fears',       label:'Fear inventory'},
  {id:'fear2',       label:'Exploration of fear'},
  {id:'sexRelations',label:'Sex & relationships'},
  {id:'amends',      label:'Amends (8th step)'},
  {id:'defects',     label:'Defects & shortcomings'},
];

function generateShareKey(len=10){
  const arr = new Uint8Array(len); crypto.getRandomValues(arr);
  let out=''; for(let i=0;i<len;i++) out += SHARE_ALPHABET[arr[i]%SHARE_ALPHABET.length];
  return out.slice(0,5)+'-'+out.slice(5);
}
function normalizeShareKey(s){ return (s||'').toUpperCase().replace(/[^A-Z2-9]/g,''); }

async function encryptShare(obj, shareKey){
  const salt = randomSalt();
  const key = await deriveBackupKey(normalizeShareKey(shareKey), salt);
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const plaintext = new TextEncoder().encode(JSON.stringify(obj));
  const cipher = new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, plaintext));
  const b64 = (bytes)=>btoa(String.fromCharCode(...bytes));
  return { kind:'sponsor-share', version:SHARE_VERSION, salt, iv:b64(iv), cipher:b64(cipher) };
}
async function decryptShare(blob, shareKey){
  if(!blob || !blob.cipher || !blob.iv || !blob.salt) throw new Error('Not a valid shared file.');
  const fromB64 = (s)=>Uint8Array.from(atob(s), c=>c.charCodeAt(0));
  const key = await deriveBackupKey(normalizeShareKey(shareKey), blob.salt);
  let plaintext;
  try{ plaintext = await crypto.subtle.decrypt({name:'AES-GCM', iv:fromB64(blob.iv)}, key, fromB64(blob.cipher)); }
  catch(e){ throw new Error('Wrong key or corrupted file.'); }
  return JSON.parse(new TextDecoder().decode(plaintext));
}

/* Build the inner package the sponsee sends. stepsState = the loaded sw_steps object. */
function packageForSponsor(stepsState, stepIds, fromName){
  const payload = {};
  stepIds.forEach(id=>{ if(stepsState && id in stepsState) payload[id]=stepsState[id]; });
  return { v:SHARE_VERSION, dir:'to-sponsor', fromName:fromName||'', created:new Date().toISOString(), steps:stepIds, payload };
}
/* Build the reply the sponsor sends back (payload + their comments). */
function packageReplyForSponsee(review, fromName){
  return { v:SHARE_VERSION, dir:'to-sponsee', fromName:fromName||'', created:new Date().toISOString(),
           steps:review.steps||[], payload:review.payload||{}, comments:review.comments||{} };
}
/* Encrypt a package and mint its one-time key in one call. */
async function buildSharePackage(inner){
  const key = generateShareKey();
  const blob = await encryptShare(inner, key);
  return { blob, key };
}
/* Decrypt + validate an incoming box. Returns the inner package. */
async function openSharePackage(blob, shareKey){
  const inner = await decryptShare(blob, shareKey);
  if(!inner || (inner.dir!=='to-sponsor' && inner.dir!=='to-sponsee'))
    throw new Error('This file is not a step-work share.');
  return inner;
}

/* ── PENDING SHARE (F6.1) ──
   A share's one-time key lives only on the result screen — but the remote flow
   means leaving the app (to send the file), and coming back reloads + re-locks,
   which used to wipe the key forever. So the freshly built share (key + box) is
   kept in local storage until the user confirms Done, then wiped. 48-hour
   timeout as a backstop. Same exposure as the rest of the local store: the
   device already holds the plaintext step work behind the same PIN. */
const PENDING_SHARE_KEY = 'sw_pending_share';
const PENDING_SHARE_TTL_MS = 48*3600*1000;
function savePendingShare(p){ try{ localStorage.setItem(PENDING_SHARE_KEY, JSON.stringify({...p, createdAt:Date.now()})); }catch{} }
function loadPendingShare(){
  try{
    const p=JSON.parse(localStorage.getItem(PENDING_SHARE_KEY)||'null');
    if(!p) return null;
    if(Date.now()-(p.createdAt||0) > PENDING_SHARE_TTL_MS){ localStorage.removeItem(PENDING_SHARE_KEY); return null; }
    return p;
  }catch{ return null; }
}
function clearPendingShare(){ try{ localStorage.removeItem(PENDING_SHARE_KEY); }catch{} }
/* 'feedback' is the legacy label kept so an in-flight pending share still resumes. */
function isFeedbackLabel(l){ return l==='feedback'||l==='review-thoughts'; }
/* Loose name match for the sponsor's filing step. Program names are informal
   ("M." vs "Mike R."), so only flag pairs that share nothing at all: any token
   of one being a prefix of any token of the other counts as a match. */
function namesLooselyMatch(a,b){
  const toks=(s)=>String(s||'').toLowerCase().split(/[^a-z]+/).filter(Boolean);
  const A=toks(a), B=toks(b);
  if(!A.length||!B.length) return true; // nothing to compare - stay quiet
  return A.some(x=>B.some(y=>x.startsWith(y)||y.startsWith(x)));
}

/* ── SAVED SPONSOR NOTES (F6.3) ──
   Sponsee side: the latest unlocked reply from the sponsor is kept on-device so
   the notes can be revisited (Sponsor sharing → Notes). Replaced on the next
   import; removable any time. Same privacy posture as the rest of the local
   store — it's the sponsee's own work plus the sponsor's notes on it. */
const SPONSOR_FEEDBACK_KEY='sw_sponsor_feedback';
function saveSponsorFeedback(inner){
  try{ localStorage.setItem(SPONSOR_FEEDBACK_KEY, JSON.stringify({
    savedAt:new Date().toISOString(), fromName:inner.fromName||'',
    steps:inner.steps||[], payload:inner.payload||{}, comments:inner.comments||{},
  })); }catch{}
}
function loadSponsorFeedback(){ try{ return JSON.parse(localStorage.getItem(SPONSOR_FEEDBACK_KEY)||'null'); }catch{ return null; } }
function clearSponsorFeedback(){ try{ localStorage.removeItem(SPONSOR_FEEDBACK_KEY); }catch{} }

/* ── SPONSEE REVIEWS STORE (F6) ──
   Sponsor-side only. Imported reviews are filed UNDER the sponsee's contact id,
   kept separate from the sponsor's own step work so the two never mix. Each
   review carries an expiry; purgeExpiredReviews() runs on app launch and drops
   anything past its date (the 14-day self-destruct). Decrypted payloads live
   only here in the app's local store — never written out as a plain file. */
const SPONSEE_REVIEWS_KEY = 'sw_sponsee_reviews';
const DAY_MS = 86400000;

function loadSponseeReviews(){
  try{ return JSON.parse(localStorage.getItem(SPONSEE_REVIEWS_KEY)||'{}') || {}; }
  catch{ return {}; }
}
function saveSponseeReviews(obj){ try{ localStorage.setItem(SPONSEE_REVIEWS_KEY, JSON.stringify(obj)); }catch{} }

function reviewExpiryDays(){
  try{ const ui=JSON.parse(localStorage.getItem(UI_SETTINGS_KEY)||'{}'); return ui.reviewExpiryDays || 14; }
  catch{ return 14; }
}

/* File a freshly-imported review under a sponsee contact id. */
function addSponseeReview(contactId, inner){
  const all = loadSponseeReviews();
  const now = Date.now();
  const days = reviewExpiryDays();
  const review = {
    reviewId:  'r_'+now.toString(36)+Math.random().toString(36).slice(2,6),
    importedAt: new Date(now).toISOString(),
    expiresAt:  new Date(now + days*DAY_MS).toISOString(),
    sourceName: inner.fromName || '',
    steps:      inner.steps || [],
    payload:    inner.payload || {},
    comments:   inner.comments || {},   // sponsor's notes, keyed by section or section:itemId
    sentBackAt: null,
  };
  all[contactId] = [review, ...(all[contactId]||[])];
  saveSponseeReviews(all);
  return review;
}

function updateSponseeReview(contactId, reviewId, patch){
  const all = loadSponseeReviews();
  const list = all[contactId]||[];
  all[contactId] = list.map(r=> r.reviewId===reviewId ? {...r, ...patch} : r);
  saveSponseeReviews(all);
}
function removeSponseeReview(contactId, reviewId){
  const all = loadSponseeReviews();
  const list = (all[contactId]||[]).filter(r=>r.reviewId!==reviewId);
  if(list.length) all[contactId]=list; else delete all[contactId];
  saveSponseeReviews(all);
}

/* days left until expiry (negative = already expired). */
function reviewDaysLeft(review){
  if(!review || !review.expiresAt) return null;
  return Math.ceil((new Date(review.expiresAt).getTime() - Date.now()) / DAY_MS);
}

/* The 14-day self-destruct. Runs once on app launch. Returns count purged. */
function purgeExpiredReviews(){
  const all = loadSponseeReviews();
  const now = Date.now();
  let purged = 0, changed = false;
  for(const cid of Object.keys(all)){
    const kept = (all[cid]||[]).filter(r=>{
      const alive = r.expiresAt && new Date(r.expiresAt).getTime() > now;
      if(!alive) purged++;
      return alive;
    });
    if(kept.length !== (all[cid]||[]).length){ changed = true; }
    if(kept.length) all[cid]=kept; else delete all[cid];
  }
  if(changed) saveSponseeReviews(all);
  return purged;
}

function PinGate({children}){
  const [stored, setStored] = useState(loadPin);
  const [unlocked, setUnlocked] = useState(false);
  // Reset unlock on remount (page refresh)
  useEffect(()=>{ setUnlocked(false); },[]);

  if(!stored) return <PinSetup onDone={(o)=>{ savePin(o); setStored(o); setUnlocked(true); }}/>;
  if(!unlocked) return <PinUnlock stored={stored} onUnlock={()=>setUnlocked(true)} onReset={()=>{ localStorage.removeItem(PIN_KEY); setStored(null); }}/>;
  return children;
}

  if(step==='confirm') return (

      {err && <p style={{textAlign:'center',color:'#a04030',fontStyle:'italic',marginTop:12}}>{err}</p>}

        <button disabled={pin2.length<4} onClick={()=>{
          if(pin1!==pin2){ setErr("PINs don't match — try once more."); setPin2(''); return; }
          setStep('question');
        }}
          style={{padding:'10px 24px',borderRadius:999,background:pin2.length>=4?'var(--ink)':'var(--rule)',color:'var(--paper)',border:0,cursor:pin2.length>=4?'pointer':'not-allowed',fontFamily:'Newsreader,Georgia,serif',fontSize:15}}>Continue →</button>
      </div>
    </PinShell>
  );

  if(step==='question') return (
    <PinShell eyebrow="Optional" title="Recovery question" subtitle="If you forget your PIN, the only way back in is the answer to a question you set now. You can also skip — but if you forget the PIN there will be no way to recover your data.">
      <div style={{marginTop:8}}>
        <div className="eyebrow" style={{marginBottom:6}}>Question</div>
        <input value={question} onChange={(e)=>setQuestion(e.target.value)} placeholder="e.g. What street did I grow up on?"
          style={{width:'100%',padding:'10px 0',background:'transparent',border:0,borderBottom:'1px solid var(--rule)',fontFamily:'Newsreader,Georgia,serif',fontSize:17,color:'var(--ink)',outline:'none'}}/>

        <input value={answer} onChange={(e)=>setAnswer(e.target.value)} placeholder="Case-insensitive. Choose something only you know."

        <button disabled={!question.trim()||!answer.trim()} onClick={()=>finish(true)}

  );
  return null;
}

function PinUnlock({stored, onUnlock, onReset}){
  const [pin, setPin] = useState('');
  const [err, setErr] = useState('');
  const [attempts, setAttempts] = useState(0);
  const [delayUntil, setDelayUntil] = useState(0);
  const [showRecovery, setShowRecovery] = useState(false);
  const [answer, setAnswer] = useState('');
  const [recoveryErr, setRecoveryErr] = useState('');
  const [tick, setTick] = useState(0);

  // tick to refresh the remaining-delay countdown
  useEffect(()=>{
    if(delayUntil<=Date.now()) return;
    const t = setInterval(()=>setTick(n=>n+1), 500);
    return ()=>clearInterval(t);
  },[delayUntil]);

  const tryPin = async (entered)=>{
    if(Date.now()<delayUntil){ setErr('Please wait before trying again.'); return; }
    const hash = await sha256(stored.salt + entered);
    if(hash===stored.hash){ onUnlock(); return; }
    const n = attempts+1;
    setAttempts(n);
    setPin('');
    setErr("That PIN didn't match.");
    if(n>=3){
      const wait = Math.min(60, 2**(n-2)) * 1000; // 2s, 4s, 8s, 16s, 32s, 60s…
      setDelayUntil(Date.now()+wait);
    }
  };

  const tryRecovery = async ()=>{
    if(!stored.answerHash){ return; }
    const h = await sha256(stored.salt + answer.trim().toLowerCase());
    if(h===stored.answerHash){
      if(confirm('Recovery accepted. The PIN will be cleared so you can set a new one. Continue?')){
        onReset();
      }
    }else{
      setRecoveryErr("That answer didn't match.");
    }
  };

  // Auto-submit at 6 digits, allow manual submit at 4+
  useEffect(()=>{
    if(pin.length===6) tryPin(pin);
    // eslint-disable-next-line
  },[pin]);

  const remaining = Math.max(0, Math.ceil((delayUntil-Date.now())/1000));

  if(showRecovery && stored.question) return (
    <PinShell eyebrow="Recovery" title="Answer your security question" subtitle={stored.question}>
      <input value={answer} onChange={(e)=>{setAnswer(e.target.value);setRecoveryErr('');}}
        autoFocus
        style={{width:'100%',padding:'10px 0',background:'transparent',border:0,borderBottom:'1px solid var(--rule)',fontFamily:'Newsreader,Georgia,serif',fontSize:17,color:'var(--ink)',outline:'none',marginTop:12}}/>
      {recoveryErr && <p style={{textAlign:'center',color:'#a04030',fontStyle:'italic',marginTop:12}}>{recoveryErr}</p>}
      <div style={{textAlign:'center',marginTop:24,display:'flex',justifyContent:'center',gap:12}}>
        <button onClick={()=>setShowRecovery(false)} style={{padding:'10px 20px',borderRadius:999,background:'transparent',color:'var(--muted)',border:'1px solid var(--rule)',cursor:'pointer',fontFamily:'Newsreader,Georgia,serif',fontSize:14}}>Back</button>
        <button disabled={!answer.trim()} onClick={tryRecovery} style={{padding:'10px 24px',borderRadius:999,background:answer.trim()?'var(--ink)':'var(--rule)',color:'var(--paper)',border:0,cursor:answer.trim()?'pointer':'not-allowed',fontFamily:'Newsreader,Georgia,serif',fontSize:15}}>Reset PIN →</button>
      </div>
    </PinShell>
  );

  return (
    <PinShell eyebrow="Locked" title="Enter your PIN">
      <PinKeypad value={pin} onChange={(v)=>{setPin(v);setErr('');}} />
      {err && <p style={{textAlign:'center',color:'#a04030',fontStyle:'italic',marginTop:12}}>{err}</p>}
      {remaining>0 && <p style={{textAlign:'center',color:'var(--muted)',fontStyle:'italic',marginTop:8}}>Try again in {remaining}s</p>}
      <div style={{textAlign:'center',marginTop:16}}>
        <button disabled={pin.length<4||remaining>0} onClick={()=>tryPin(pin)} style={{padding:'8px 20px',borderRadius:999,background:(pin.length>=4&&remaining<=0)?'var(--ink)':'var(--rule)',color:'var(--paper)',border:0,cursor:(pin.length>=4&&remaining<=0)?'pointer':'not-allowed',fontFamily:'Newsreader,Georgia,serif',fontSize:14}}>Unlock</button>
      </div>
      {stored.question && (
        <div style={{textAlign:'center',marginTop:22}}>
          <button onClick={()=>setShowRecovery(true)} style={{background:'transparent',border:0,cursor:'pointer',color:'var(--terra-ink)',fontFamily:'Newsreader,Georgia,serif',fontStyle:'italic',fontSize:14}}>Forgot PIN?</button>
        </div>
      )}
    </PinShell>
  );
}

/* First-use instruction for a step screen. Shows an expanded calm callout the first
   time a screen is opened (tracked per-id in localStorage). Once dismissed it
   collapses to a small "How this works" affordance the user can re-open any time —
   prominent on first use, never permanently in the way. (F4) */
const HINT_KEY_PREFIX = 'sw_hint_seen_';
function FirstUseHint({id, title, children}){
  const storeKey = HINT_KEY_PREFIX + id;
  const [seen, setSeen] = useState(()=>{ try{ return localStorage.getItem(storeKey)==='1'; }catch{ return false; } });
  const [open, setOpen] = useState(()=>{ try{ return localStorage.getItem(storeKey)!=='1'; }catch{ return true; } });
  const dismiss = ()=>{ try{ localStorage.setItem(storeKey,'1'); }catch{} setSeen(true); setOpen(false); };
  if(!open){
    return (
      <Pressable onClick={()=>setOpen(true)} style={{display:'inline-flex',alignItems:'center',gap:8,padding:'8px 0'}}>
        <span style={{display:'inline-flex',alignItems:'center',justifyContent:'center',width:18,height:18,borderRadius:999,border:'1px solid var(--terra-soft)',color:'var(--terra-ink)',fontSize:11,fontStyle:'italic',fontFamily:'Newsreader,Georgia,serif'}}>i</span>
        <span className="serif" style={{fontSize:13,color:'var(--terra-ink)',fontStyle:'italic'}}>How this works</span>
      </Pressable>
    );
  }
  return (
    <div style={{padding:'16px 18px',border:'1px solid var(--terra-soft)',background:'rgba(214,165,140,0.07)',borderRadius:10,position:'relative'}}>
      <div style={{display:'flex',alignItems:'baseline',justifyContent:'space-between',gap:12,marginBottom:6}}>
        <span className="eyebrow" style={{color:'var(--terra-ink)'}}>{title||'How this works'}</span>
        <Pressable onClick={dismiss} style={{padding:'2px 4px',flexShrink:0}}>
          <span className="serif" style={{fontSize:14,color:'var(--muted)'}}>{seen?'close':'got it ✓'}</span>
        </Pressable>
      </div>
      <p className="serif" style={{fontSize:15,lineHeight:1.55,color:'var(--ink-2)',textWrap:'pretty',margin:0}}>{children}</p>
    </div>
  );
}

function romanize(n){
  const map=[['M',1000],['CM',900],['D',500],['CD',400],['C',100],['XC',90],['L',50],['XL',40],['X',10],['IX',9],['V',5],['IV',4],['I',1]];
  let r='';for(const[s,v]of map)while(n>=v){r+=s;n-=v;}return r;
}

function ResentmentAddScreen(){
  const nav=useNav();
  const {steps, addItem, addItems, updateItem} = useSteps();
  const existing=nav.params&&nav.params.id?steps.resentments.find(r=>r.id===nav.params.id):null;
  const isEdit = !!existing;

  // Names already on the list (lowercased), excluding the one being edited — for dedupe warnings.
  const existingNames = React.useMemo(()=>new Set(
    steps.resentments.filter(r=>!existing||r.id!==existing.id).map(r=>r.name.trim().toLowerCase())
  ),[steps.resentments, existing]);

  // Edit mode: single row
  const [name,setName]=useState(existing?existing.name:'');
  const [type,setType]=useState(existing?existing.type:'Person');
  const [note,setNote]=useState(existing?existing.note:'');
  const nameDup = name.trim() && existingNames.has(name.trim().toLowerCase());

  // Add mode: multi-row table — pick type once, then enter many names
  const [bulkType, setBulkType] = useState('Person');
  const [rows, setRows] = useState(() => Array.from({length:5}, ()=>({name:'',note:''})));

  const saveSingle = ()=>{
    if(!name.trim()){ alert('Please add a name before saving.'); return; }
    if(nameDup && !confirm(`"${name.trim()}" is already on the list. Add it anyway?`)) return;
    updateItem('resentments', existing.id, {name:name.trim(), type, note:note.trim()});
    nav.back();
  };
  const saveBulk = ()=>{
    const valid = rows.filter(r=>r.name.trim());
    if(valid.length===0){ alert('Add at least one name before saving.'); return; }
    const dups = valid.filter(r=>existingNames.has(r.name.trim().toLowerCase())).map(r=>r.name.trim());
    if(dups.length && !confirm(`Already on the list: ${dups.join(', ')}.\n\nSave anyway?`)) return;
    addItems('resentments', valid.map(r=>({name:r.name.trim(), type:bulkType, note:r.note.trim()})));
    nav.back();
  };
  const updateRow = (i, field, v) => setRows(prev=>{ const n=[...prev]; n[i]={...n[i],[field]:v}; return n; });
  const addRow = ()=>setRows(prev=>[...prev, ...Array.from({length:5}, ()=>({name:'',note:''}))]);
  const removeRow = (i)=>setRows(prev=>prev.length>1?prev.filter((_,k)=>k!==i):prev);

  if(isEdit) return (
    <>
      <AppBar eyebrow="Edit entry" title="A name comes to mind" right={<ButtonText onClick={saveSingle}>save →</ButtonText>}/>
      <ScreenBody>
        <section style={{padding:'12px 24px 24px'}}>
          <Eyebrow style={{marginBottom:4}}>Name or description</Eyebrow>
          <SerifInput value={name} onChange={setName} autoFocus placeholder="e.g. Dad, Mrs. K., the court…"/>
          {nameDup && <p className="serif" style={{fontSize:13,color:'var(--terra-ink)',fontStyle:'italic',marginTop:6}}>Already on your list — you can still save it.</p>}
          <div style={{marginTop:32}}>
            <Eyebrow style={{marginBottom:12}}>What are they?</Eyebrow>
            <SegPills value={type} onChange={setType} options={[{value:'Person',label:'Person'},{value:'Institution',label:'Institution'},{value:'Principle',label:'Principle'}]}/>
          </div>
          <div style={{marginTop:32}}>
            <Eyebrow style={{marginBottom:4}}>Note <Stamp style={{marginLeft:8}}>optional</Stamp></Eyebrow>
            <SerifInput value={note} onChange={setNote} placeholder="family · work · legal · childhood…"/>
          </div>
        </section>
      </ScreenBody>
    </>
  );

  const filledCount = rows.filter(r=>r.name.trim()).length;

  return (
    <>
      <AppBar eyebrow="New entries" title="Names come to mind" right={<ButtonText onClick={saveBulk}>save {filledCount>0?`(${filledCount}) `:''}→</ButtonText>}/>
      <ScreenBody>
        <section style={{padding:'12px 24px 0'}}>
          <p className="serif" style={{fontSize:14,color:'var(--muted)',fontStyle:'italic',lineHeight:1.55,textWrap:'pretty',margin:0}}>
            Pick a category, then add as many names as come to mind. Don't edit. Don't qualify. Tap "+ add row" to keep going.
          </p>
          <div style={{marginTop:24}}>
            <Eyebrow style={{marginBottom:12}}>What are they?</Eyebrow>
            <SegPills value={bulkType} onChange={setBulkType} options={[
              {value:'Person',label:'Person'},
              {value:'Institution',label:'Institution'},
              {value:'Principle',label:'Principle'},
            ]}/>
          </div>
        </section>
        <section style={{padding:'28px 0 0'}}>
          <div style={{display:'grid',gridTemplateColumns:'28px 1fr 1fr 32px',gap:8,padding:'0 16px 8px',borderBottom:'1px solid var(--rule)'}}>
            <span/>
            <Eyebrow>Name</Eyebrow>
            <Eyebrow>Note · optional</Eyebrow>
            <span/>
          </div>
          {rows.map((row,i)=>{
            const rowDup = row.name.trim() && existingNames.has(row.name.trim().toLowerCase());
            return (
            <div key={i} style={{display:'grid',gridTemplateColumns:'28px 1fr 1fr 32px',gap:8,padding:'10px 16px',borderBottom:'1px solid var(--rule-soft)',alignItems:'center'}}>
              <span className="serif" style={{fontSize:13,color:'var(--muted)',fontVariantNumeric:'oldstyle-nums',textAlign:'right'}}>{i+1}</span>
              <div style={{minWidth:0}}>
                <input value={row.name} onChange={(e)=>updateRow(i,'name',e.target.value)}
                  placeholder="Dad, Mrs. K., the court…" autoFocus={i===0}
                  autoComplete="off"
                  style={{width:'100%',padding:'8px 0',background:'transparent',border:0,borderBottom:'1px solid var(--rule-soft)',fontFamily:'Newsreader,Georgia,serif',fontSize:16,color:'var(--ink)',outline:'none'}}/>
                {rowDup && <span className="serif" style={{fontSize:12,color:'var(--terra-ink)',fontStyle:'italic'}}>already on list</span>}
              </div>
              <input value={row.note} onChange={(e)=>updateRow(i,'note',e.target.value)}
                placeholder="family · work · legal…"
                style={{padding:'8px 0',background:'transparent',border:0,borderBottom:'1px solid var(--rule-soft)',fontFamily:'Newsreader,Georgia,serif',fontSize:15,color:'var(--ink-2)',outline:'none'}}/>
              <Pressable onClick={()=>removeRow(i)} style={{padding:'4px 0',textAlign:'center'}}>
                <span className="serif" style={{fontSize:14,color:rows.length>1?'var(--faint)':'transparent'}}>✕</span>
              </Pressable>
            </div>
            );
          })}
        </section>
        <section style={{padding:'12px 24px 0'}}>
          <Pressable onClick={addRow} style={{display:'flex',alignItems:'center',gap:10,padding:'14px 0'}}>
            <span className="serif" style={{fontSize:18,color:'var(--terra-ink)'}}>+</span>
            <span className="serif" style={{fontSize:15,color:'var(--terra-ink)',fontStyle:'italic'}}>add 5 more rows</span>
          </Pressable>
        </section>
        <section style={{padding:'24px 24px 36px'}}>
          <ButtonSerif primary onClick={saveBulk} style={{width:'100%'}}>
            Save {filledCount>0?`${filledCount} `:''}entries
          </ButtonSerif>
          <div style={{marginTop:24,paddingTop:22,borderTop:'1px solid var(--rule-soft)'}}>
            <p className="serif" style={{fontSize:14,color:'var(--muted)',fontStyle:'italic',lineHeight:1.55,textWrap:'pretty'}}>"Put down every name. If a name comes to mind, put it down."</p>
            <Stamp style={{marginTop:8,display:'block'}}>Big Book, pg 65</Stamp>
          </div>
        </section>
      </ScreenBody>
    </>
  );
}

function CauseEditScreen(){
  const nav=useNav();
  const {steps, addItem, updateItem, removeItem} = useSteps();
  const isAdd=nav.current==='cause-add';
  const c=isAdd?null:steps.causes.find(x=>x.id===(nav.params&&nav.params.id))||null;
  const nameForHeader=isAdd?((nav.params&&nav.params.name)||''):(c?c.name:'');
  const [cause,setCause]=useState(c?c.cause:'');
  const [aff,setAff]=useState(()=>INSTINCTS.reduce((m,ins)=>{m[ins.key]=c?!!c[ins.key]:false;return m;},{}));
  const save=()=>{
    if(!cause.trim()){ alert('Please enter the cause before saving.'); return; }
    const data = { name:nameForHeader, cause:cause.trim(), ...aff };
    if(isAdd) addItem('causes', data);
    else updateItem('causes', c.id, data);
    nav.back();
  };
  if(!isAdd && !c){
    return (<><AppBar eyebrow="Cause" title="Not found"/></>);
  }
  return (
    <>
      <AppBar eyebrow={`Resentful at ${nameForHeader}`} title="A cause" right={<ButtonText onClick={save}>save →</ButtonText>}/>
      <ScreenBody>
        <section style={{padding:'12px 24px 0'}}>
          <Eyebrow style={{marginBottom:4}}>Cause · 10 words or fewer</Eyebrow>
          <SerifTextarea value={cause} onChange={setCause} minRows={2} placeholder="Facts only — what happened, in plain language"/>
        </section>
        <section style={{padding:'32px 24px 0'}}>
          <Eyebrow style={{marginBottom:16}}>Affects my…</Eyebrow>
          {INSTINCTS.map(ins=>(
            <Pressable key={ins.key} onClick={()=>setAff(a=>({...a,[ins.key]:!a[ins.key]}))} style={{display:'flex',alignItems:'center',gap:14,padding:'12px 0',borderBottom:'1px solid var(--rule-soft)'}}>
              <HandCheck checked={aff[ins.key]}/>
              <span className="serif" style={{flex:1,fontSize:18,color:aff[ins.key]?'var(--ink)':'var(--muted)',fontStyle:aff[ins.key]?'normal':'italic'}}>{ins.long}</span>
            </Pressable>
          ))}
        </section>
        {!isAdd && (
          <section style={{padding:'4px 24px 36px',textAlign:'center'}}>
            <Pressable onClick={()=>{ if(confirm('Remove this cause?')){ removeItem('causes', c.id); nav.back(); } }} style={{padding:'12px 0'}}>
              <span className="serif" style={{fontSize:15,color:'#a04030',fontStyle:'italic'}}>Remove this cause</span>
            </Pressable>
          </section>
        )}
      </ScreenBody>
    </>
  );
}

function FaultsScreen(){
  const nav=useNav();
  const {steps, removeItem} = useSteps();
  // Auto-populate principle: every cause is available to work. A "fault" entry
  // is keyed to its causeId. If the source cause was later removed, we still keep
  // the fault entry (preserve downstream work) and flag it as orphaned.
  const causeById = React.useMemo(()=>Object.fromEntries(steps.causes.map(c=>[c.id,c])),[steps.causes]);
  const worked = steps.faults;
  const workedIds = new Set(worked.map(f=>f.causeId));
  const remainingCauses = steps.causes.filter(c=>!workedIds.has(c.id));
  const countAnswered = (f)=>FAULTS_ALL_KEYS.filter(k=>f[k] && String(f[k]).trim()).length;
  return (
    <>
      <AppBar eyebrow="III · Step 4 · pg 66–67" title="Our faults"/>
      <ScreenBody>
        <section style={{padding:'12px 24px 0'}}>
          <FirstUseHint id="faults" title="Step 4 · Our faults">Each cause you worked carries here. For every one, answer where you were selfish, dishonest, self-seeking, or afraid — keeping the focus on your part, not theirs.</FirstUseHint>
        </section>
        <section style={{padding:'4px 24px 0'}}>
          <Scripture cite="Big Book, pg 66–67">"We turned back to the list… we resolutely looked for our own mistakes. Where were we to blame?"</Scripture>
        </section>
        <section style={{padding:'22px 24px 0'}}>
          <NoteBox>
            {FAULTS_INSTRUCTIONS.map((line,i)=>(
              <span key={i} style={{display:'block',marginTop:i?6:0}}>{line}</span>
            ))}
          </NoteBox>
        </section>
        {worked.length===0 && (
          <section style={{padding:'24px',textAlign:'center'}}>
            <p className="serif" style={{fontSize:15,color:'var(--muted)',fontStyle:'italic',lineHeight:1.55}}>
              {steps.causes.length===0
                ? 'Complete Causes & affects first — faults builds on each cause.'
                : 'Tap a cause below to begin working it.'}
            </p>
          </section>
        )}
        {worked.length>0 && (
          <section style={{padding:'28px 24px 0'}}>
            <Eyebrow style={{marginBottom:6}}>Worked · {worked.length}</Eyebrow>
            {worked.map(f=>{
              const ans=countAnswered(f);
              const total=FAULTS_ALL_KEYS.length;
              const orphan=!causeById[f.causeId];
              return (
                <div key={f.id} style={{display:'flex',alignItems:'flex-start',gap:12,padding:'14px 0',borderBottom:'1px solid var(--rule-soft)',minWidth:0}}>
                  <Pressable onClick={()=>nav.push('fault-add',{id:f.id})} style={{flex:1,textAlign:'left',padding:0,minWidth:0}}>
                    <div style={{display:'flex',alignItems:'baseline',gap:8,minWidth:0}}>
                      <span className="serif" style={{fontSize:16,color:'var(--ink)',lineHeight:1.3,flex:1,minWidth:0,textWrap:'pretty'}}>{f.name}</span>

function FaultAddScreen(){

  const existing = nav.params&&nav.params.id ? steps.faults.find(f=>f.id===nav.params.id) : null;

  const cause = steps.causes.find(c=>c.id===causeId) || (existing?{id:existing.causeId,name:existing.name,cause:existing.cause}:null);

  const [answers, setAnswers] = useState(()=>{
    const seed={};
    FAULTS_ALL_KEYS.forEach(k=>{ seed[k]=existing&&existing[k]?existing[k]:''; });

  const setAnswer=(k,v)=>setAnswers(a=>({...a,[k]:v}));

function FearEditScreen(){
  const nav=useNav();
  const {steps, addItem, updateItem, removeItem} = useSteps();
  // Resolve target: editing an existing fear (id), working a specific cause
  // (causeId), or a brand-new standalone fear (neither).
  const byId = nav.params&&nav.params.id ? steps.fears.find(f=>f.id===nav.params.id) : null;
  const causeId = nav.params&&nav.params.causeId;
  const fromCause = causeId ? steps.causes.find(c=>c.id===causeId) : null;
  const existing = byId || (causeId ? steps.fears.find(f=>f.causeId===causeId) : null);
  const linkedCause = fromCause || (existing&&existing.causeId ? steps.causes.find(c=>c.id===existing.causeId) : null);
  const isCauseLinked = !!causeId || !!(existing&&existing.causeId);

  const [name,setName]=useState(existing?existing.name:(fromCause?fromCause.name:''));
  const [cause,setCause]=useState(existing?existing.cause:(fromCause?fromCause.cause:''));
  const [cats,setCats]=useState(new Set(existing?existing.categories:[]));
  const toggle=(c)=>setCats(s=>{const n=new Set(s);n.has(c)?n.delete(c):n.add(c);return n;});

  const save=()=>{
    if(!name.trim()){ alert('Please add a name or situation.'); return; }
    const data={ name:name.trim(), cause:cause.trim(), categories:[...cats] };
    if(isCauseLinked) data.causeId = causeId || existing.causeId;
    if(existing) updateItem('fears', existing.id, data);
    else addItem('fears', data);
    nav.back();
  };

  const title = isCauseLinked ? 'Fears for this cause' : (existing?'Edit fear':'A fear comes to mind');

  return (
    <>
      <AppBar eyebrow={linkedCause?`Resentful at ${linkedCause.name}`:(existing?'Edit fear':'New fear')} title={title} right={<ButtonText onClick={save}>save →</ButtonText>}/>
      <ScreenBody>
        <section style={{padding:'12px 24px 0'}}>
          {isCauseLinked ? (
            <p className="serif" style={{fontSize:17,color:'var(--ink)',lineHeight:1.45,fontStyle:'italic',textWrap:'pretty',margin:0}}>"{cause}"</p>
          ) : (
            <>
              <Eyebrow style={{marginBottom:4}}>Name or situation</Eyebrow>
              <SerifInput value={name} onChange={setName} autoFocus placeholder="A fear you carry — even with no resentment behind it"/>
              <div style={{marginTop:24}}>
                <Eyebrow style={{marginBottom:4}}>What is the fear about?</Eyebrow>
                <SerifTextarea value={cause} onChange={setCause} minRows={2} placeholder="A brief description, optional"/>
              </div>
            </>
          )}
        </section>
        <section style={{padding:'28px 24px 0'}}>
          <div style={{display:'flex',alignItems:'baseline',justifyContent:'space-between',marginBottom:6}}>
            <Eyebrow>Fear categories · check all that apply</Eyebrow>
            <ButtonText onClick={()=>nav.push('fear-categories')}>edit list →</ButtonText>
          </div>
          <p className="serif" style={{fontSize:13,color:'var(--muted)',fontStyle:'italic',lineHeight:1.5,margin:'0 0 8px'}}>"We asked ourselves why we had them." — pg 68</p>
          {steps.fearCategories.map(c=>(
            <Pressable key={c} onClick={()=>toggle(c)} style={{display:'flex',alignItems:'center',gap:14,padding:'12px 0',borderBottom:'1px solid var(--rule-soft)',minWidth:0}}>
              <HandCheck checked={cats.has(c)} size={18}/>
              <span className="serif" style={{flex:1,minWidth:0,fontSize:16,color:cats.has(c)?'var(--ink)':'var(--muted)',fontStyle:cats.has(c)?'normal':'italic'}}>{c}</span>
            </Pressable>
          ))}
        </section>
        {existing && !existing.causeId && (
          <section style={{padding:'24px',textAlign:'center'}}>
            <Pressable onClick={()=>{ if(confirm(`Remove "${existing.name}"?`)){ removeItem('fears', existing.id); nav.back(); } }} style={{padding:'12px 0'}}>
              <span className="serif" style={{fontSize:15,color:'#a04030',fontStyle:'italic'}}>Remove this fear</span>
            </Pressable>
          </section>
        )}
        <section style={{padding:'8px 24px 40px'}}>
          <ButtonSerif primary onClick={save} style={{width:'100%'}}>Save</ButtonSerif>
        </section>
      </ScreenBody>
    </>
  );
}

function CategoryNameInput({value,onCommit}){
  // Local draft so typing stays smooth; commit to persisted state on blur/Enter.
  const [draft,setDraft]=React.useState(value);
  React.useEffect(()=>{ setDraft(value); },[value]);
  const commit=()=>{ const v=draft.trim(); if(v && v!==value) onCommit(v); else setDraft(value); };
  return (
    <input value={draft}
      onChange={e=>setDraft(e.target.value)}
      onBlur={commit}
      onKeyDown={e=>{ if(e.key==='Enter'){ e.preventDefault(); e.target.blur(); } }}
      placeholder="Category name"
      style={{flex:1,minWidth:0,background:'transparent',border:0,fontFamily:'Newsreader,Georgia,serif',fontSize:17,color:'var(--ink)',padding:'10px 0',outline:'none'}}/>
  );
}

function FearCategoriesScreen(){
  const nav=useNav();
  const {steps, update} = useSteps();
  // Persisted list (already self-healed of blanks at load). Changes commit straight
  // to storage so a new category is instantly available to the fear checklists and
  // nothing is lost on back-navigation.
  const cats=(steps.fearCategories||[]).filter(c=>c && c.trim());
  const [newCat,setNewCat]=useState('');
  const usage=(steps.fears||[]).reduce((m,f)=>{(f.categories||[]).forEach(c=>{m[c]=(m[c]||0)+1;});return m;},{});
  const commit=(next)=>update({fearCategories: next.filter(c=>c && c.trim()).map(c=>c.trim())});
  const rename=(i,v)=>commit(cats.map((c,k)=>k===i?v:c));
  const remove=(i)=>commit(cats.filter((_,k)=>k!==i));
  const add=()=>{
    const v=newCat.trim();
    if(!v) return;
    if(cats.some(c=>c.toLowerCase()===v.toLowerCase())){ setNewCat(''); return; }
    commit([...cats, v]);
    setNewCat('');
  };
  const restore=()=>commit([...DEFAULT_FEAR_CATS_V2]);
  return (
    <>
      <AppBar eyebrow="Fear inventory" title="Edit categories" right={<ButtonText onClick={()=>nav.back()}>done →</ButtonText>}/>
      <ScreenBody>
        <section style={{padding:'4px 24px 0'}}>
          <p className="serif" style={{fontSize:15,color:'var(--muted)',fontStyle:'italic',lineHeight:1.55,margin:0,textWrap:'pretty'}}>Tune the category list so it fits your own experience. The Big Book offers these as a starting point — your sponsor may help you reshape them.</p>
        </section>
        {/* Add at the top so it's easy to reach */}
        <section style={{padding:'20px 24px 0'}}>
          <Eyebrow style={{marginBottom:8}}>Add a category</Eyebrow>
          <div style={{display:'flex',alignItems:'center',gap:12,minWidth:0}}>
            <SerifInput value={newCat} onChange={setNewCat} placeholder="e.g. Loneliness, Intimacy, Authority…" style={{flex:1,minWidth:0}}/>
            <Pressable onClick={add} style={{padding:'8px 10px',flexShrink:0,width:'auto',border:'1px solid var(--terra)',borderRadius:999}}>
              <span className="serif" style={{fontSize:15,color:'var(--terra-ink)'}}>+ add</span>
            </Pressable>
          </div>
        </section>
        <section style={{padding:'24px 24px 0'}}>
          <Eyebrow style={{marginBottom:12}}>Your categories · {cats.length}</Eyebrow>
          {cats.length===0 && (
            <p className="serif" style={{fontSize:15,color:'var(--muted)',fontStyle:'italic',lineHeight:1.5,padding:'8px 0'}}>No categories yet. Add one above, or restore the defaults below.</p>
          )}
          {cats.map((c,i)=>(
            <div key={c+'|'+i} style={{display:'flex',alignItems:'center',gap:12,padding:'6px 0',borderBottom:'1px solid var(--rule-soft)',minWidth:0}}>
              <span className="serif" style={{fontSize:12,color:'var(--muted)',fontStyle:'italic',width:22,flexShrink:0,fontVariantNumeric:'oldstyle-nums'}}>{romanize(i+1)}.</span>
              <CategoryNameInput value={c} onCommit={(v)=>rename(i,v)}/>
              {usage[c]>0&&<Stamp style={{flexShrink:0}}>{usage[c]} use{usage[c]!==1?'s':''}</Stamp>}
              <Pressable onClick={()=>remove(i)} style={{padding:'8px 4px',flexShrink:0,width:'auto',color:'var(--muted)'}}>
                <span className="serif" style={{fontSize:18}}>✕</span>
              </Pressable>
            </div>
          ))}
        </section>
        <section style={{padding:'28px 24px 36px'}}>
          <Pressable onClick={restore} style={{padding:'12px 0'}}>
            <span className="serif" style={{fontSize:15,color:'var(--terra-ink)',fontStyle:'italic'}}>Restore the default eight categories</span>
          </Pressable>
        </section>
      </ScreenBody>
    </>
  );
}

/* Amends 'direct' types — restored (was referenced by AmendsScreen/AmendEditScreen
   but its definition had been lost; absence crashed the Amends screen). Index 2
   ('never') is the safe fallback used when a.direct is missing/unknown. */
const AMENDS_WILL=[{key:'now',label:'Direct — now',color:'var(--sage)'},{key:'later',label:'Direct — not yet',color:'var(--gold)'},{key:'never',label:'Never',color:'var(--muted)'},{key:'living',label:'Living amends',color:'var(--terra-ink)'}];

function AmendsScreen(){
  const nav=useNav();
  const {steps, addItem, removeItem} = useSteps();
  const amends=steps.amends||[];

  // Auto-prefill: every resentment (name + first cause) seeds an amends row, so the
  // list arrives populated. Keyed by resentmentId; existing amends preserved.
  const causeByName=React.useMemo(()=>{
    const m={}; (steps.causes||[]).forEach(c=>{ if(!m[c.name]) m[c.name]=c.cause; }); return m;
  },[steps.causes]);
  const seededIds=new Set(amends.filter(a=>a.resentmentId).map(a=>a.resentmentId));
  const toSeed=(steps.resentments||[]).filter(r=>!seededIds.has(r.id));
  const seedAll=()=>{
    toSeed.forEach(r=>addItem('amends',{resentmentId:r.id,name:r.name,cause:causeByName[r.name]||'',harms:'',direct:'now',living:false,complete:false}));
  };

  // Status groups (mutually exclusive). complete > living > in-progress > not-started.
  const statusOf=(a)=> a.complete?'complete' : a.living?'living' : (a.harms&&a.harms.trim())?'progress' : 'notstarted';
  const GROUPS=[
    {key:'notstarted',label:'Not started'},
    {key:'progress',  label:'In progress'},
    {key:'living',    label:'Living amends'},
    {key:'complete',  label:'Complete'},
  ];
  const byGroup={}; GROUPS.forEach(g=>byGroup[g.key]=[]);
  amends.forEach(a=>byGroup[statusOf(a)].push(a));

  const willColor=(a)=>(AMENDS_WILL.find(w=>w.key===a.direct)||AMENDS_WILL[2]).color;
  const willLabel=(a)=>(AMENDS_WILL.find(w=>w.key===a.direct)||AMENDS_WILL[2]).label.replace('Direct — ','');

  const Row=({a})=>{
    const st=statusOf(a);
    const done=st==='complete';
    return (
      <div style={{padding:'16px 24px',borderBottom:'1px solid var(--rule-soft)',display:'flex',alignItems:'flex-start',gap:8,minWidth:0}}>
        <Pressable onClick={()=>nav.push('amend-edit',{id:a.id})} style={{flex:1,minWidth:0,padding:0,textAlign:'left',display:'block'}}>
          <span style={{display:'flex',alignItems:'baseline',gap:10,minWidth:0}}>
            <span aria-hidden="true" style={{flexShrink:0,width:14,height:14,borderRadius:'50%',border:`1.5px solid ${done?'var(--terra-ink)':'var(--muted)'}`,background:done?'var(--terra-ink)':'transparent',display:'inline-flex',alignItems:'center',justifyContent:'center',alignSelf:'center'}}>
              {done&&<span style={{color:'var(--paper)',fontSize:9,lineHeight:1}}>✓</span>}
            </span>
            <span className="serif" style={{flex:1,minWidth:0,fontSize:18,fontWeight:400,lineHeight:1.2,color:'var(--ink)'}}>{a.name}</span>
            {st!=='complete' && st!=='living' && (
              <span style={{flexShrink:0,display:'inline-flex',alignItems:'center',gap:6}}>
                <span style={{width:5,height:5,borderRadius:'50%',background:willColor(a)}}/>
                <span className="serif" style={{fontSize:12,color:willColor(a),fontStyle:'italic'}}>{willLabel(a).toLowerCase()}</span>
              </span>
            )}
          </span>
          <span style={{display:'block',paddingLeft:24,marginTop:4}}>
            {a.cause&&<Stamp style={{display:'block',marginBottom:2}}>{a.cause}</Stamp>}
            {a.harms
              ? <span className="serif" style={{display:'block',fontSize:15,color:'var(--ink-2)',lineHeight:1.5,textWrap:'pretty'}}>{a.harms}</span>
              : <span className="serif" style={{display:'block',fontSize:14,color:'var(--faint)',fontStyle:'italic'}}>— harms not listed yet —</span>}
          </span>
        </Pressable>
        <Pressable onClick={()=>{ if(confirm(`Remove "${a.name}" from amends?`)) removeItem('amends', a.id); }} style={{padding:'4px 6px',flexShrink:0,width:'auto'}}>
          <span className="serif" style={{fontSize:15,color:'var(--faint)'}}>✕</span>
        </Pressable>
      </div>
    );
  };

  return (
    <>
      <AppBar eyebrow="VIII · Steps 8 & 9 · pg 76–84" title="Amends list"/>
      <ScreenBody>
        <section style={{padding:'12px 24px 0'}}>
          <FirstUseHint id="amends" title="Steps 8 & 9 · Amends">Names and causes carry over from your resentments. For each person, list the harms, choose the amends type, and move them through the stages as you go.</FirstUseHint>
        </section>
        <section style={{padding:'4px 24px 0'}}>
          <Scripture cite="Big Book, pg 59">"Made a list of all persons we had harmed and became willing to make amends to them all."</Scripture>
        </section>

        {/* Add at top so it's always reachable */}
        <section style={{padding:'18px 24px 0'}}>
          <ButtonSerif primary onClick={()=>nav.push('amend-add')} style={{width:'100%'}}>+ add someone I've harmed</ButtonSerif>
          {toSeed.length>0 && (
            <Pressable onClick={seedAll} style={{display:'flex',alignItems:'center',gap:10,marginTop:12,padding:'12px 16px',border:'1px solid var(--terra)',borderRadius:8,background:'var(--terra-soft)'}}>
              <span className="serif" style={{fontSize:16,color:'var(--terra-ink)',flexShrink:0}}>↓</span>
              <span className="serif" style={{flex:1,minWidth:0,fontSize:15,color:'var(--terra-ink)'}}>Bring {toSeed.length} name{toSeed.length!==1?'s':''} forward from the resentment list</span>
            </Pressable>
          )}
        </section>

        <section style={{padding:'18px 24px 0'}}>
          <NoteBox>
            <span style={{display:'block'}}>Your names and causes carry forward from the resentment list. For each, list all harms and choose a status. Living (indirect) amends are for when a direct amend would cause harm or the person can't be reached.</span>
            <span style={{display:'block',marginTop:6}}>Review all of this with your sponsor to plan your amends.</span>
          </NoteBox>
        </section>

        {amends.length>0 && (
          <section style={{padding:'22px 24px 0'}}>
            <div style={{display:'flex',flexWrap:'wrap',gap:16}}>
              {GROUPS.map(g=>(
                <div key={g.key} style={{display:'flex',alignItems:'baseline',gap:6}}>
                  <span className="serif" style={{fontSize:18,color:'var(--ink)',fontVariantNumeric:'oldstyle-nums'}}>{byGroup[g.key].length}</span>
                  <span className="serif" style={{fontSize:13,color:'var(--muted)'}}>{g.label.toLowerCase()}</span>
                </div>
              ))}
            </div>
          </section>
        )}

        {amends.length===0 && toSeed.length===0 && (
          <section style={{padding:'24px',textAlign:'center'}}>
            <p className="serif" style={{fontSize:15,color:'var(--muted)',fontStyle:'italic',lineHeight:1.55}}>Add names to the resentment list first, or tap "add someone I've harmed" above.</p>
          </section>
        )}

        {GROUPS.map(g=> byGroup[g.key].length>0 && (
          <section key={g.key} style={{padding:'24px 0 0'}}>
            <Eyebrow style={{padding:'0 24px',marginBottom:6}}>{g.label} · {byGroup[g.key].length}</Eyebrow>
            {byGroup[g.key].map(a=><Row key={a.id} a={a}/>)}
          </section>
        ))}
        <section style={{padding:'24px'}}/>
      </ScreenBody>
    </>
  );
}

function AmendEditScreen(){

  // Single mutually-exclusive lifecycle status: 'progress' | 'living' | 'complete'.
  const initStatus = existing ? (existing.complete?'complete':existing.living?'living':'progress') : 'progress';

/** Is a defect "complete" for a given phase? */
function defectPhaseDone(d, phase){
  if(phase===1) return !!(d.name && d.name.trim());
  if(phase===2) return !!(d.withoutVision && d.withoutVision.trim());
  if(phase===3) return !!(d.prayer && d.prayer.trim());
  return false;
}

/** Serif column wheel picker. value is a string, options is an array of strings. */
function WheelColumn({value, options, onChange, width=66, fontSize=22}){
  const ref = useRef(null);
  const ROW_H = 40;
  // Scroll so selected sits in middle
  useEffect(()=>{
    if(!ref.current) return;
    const i = options.indexOf(value);
    if(i<0) return;
    ref.current.scrollTop = i*ROW_H;
  },[value, options]);
  const onScroll = ()=>{
    if(!ref.current) return;
    clearTimeout(ref.current._t);
    ref.current._t = setTimeout(()=>{
      const i = Math.round(ref.current.scrollTop / ROW_H);
      const clamped = Math.max(0, Math.min(options.length-1, i));
      const v = options[clamped];
      if(v !== value) onChange(v);
      ref.current.scrollTop = clamped*ROW_H;
    }, 110);
  };
  return (
    <div style={{position:'relative', width, height:ROW_H*3,
      background:'var(--surface)', border:'1px solid var(--rule)', borderRadius:8,
      overflow:'hidden'}}>
      {/* Top + bottom fade */}
      <div style={{position:'absolute',top:0,left:0,right:0,height:ROW_H,
        background:'linear-gradient(to bottom, var(--surface), transparent)',
        pointerEvents:'none',zIndex:2}}/>
      <div style={{position:'absolute',bottom:0,left:0,right:0,height:ROW_H,
        background:'linear-gradient(to top, var(--surface), transparent)',
        pointerEvents:'none',zIndex:2}}/>
      {/* Center highlight bars */}
      <div style={{position:'absolute',top:ROW_H,left:6,right:6,height:1,
        background:'var(--rule)',zIndex:1,pointerEvents:'none'}}/>
      <div style={{position:'absolute',top:ROW_H*2,left:6,right:6,height:1,
        background:'var(--rule)',zIndex:1,pointerEvents:'none'}}/>
      <div ref={ref} onScroll={onScroll}
        style={{height:'100%',overflowY:'scroll',scrollSnapType:'y mandatory',
          WebkitOverflowScrolling:'touch'}}>
        <div style={{height:ROW_H}}/>
        {options.map(opt=>(
          <div key={opt}
            onClick={()=>onChange(opt)}
            style={{height:ROW_H, display:'flex', alignItems:'center', justifyContent:'center',
              scrollSnapAlign:'center', cursor:'pointer',
              fontFamily:'Newsreader,Georgia,serif',
              fontSize, fontVariantNumeric:'oldstyle-nums',
              color: opt===value ? 'var(--ink)' : 'var(--muted)',
              fontWeight:opt===value?400:300}}>
            {opt}
          </div>
        ))}
        <div style={{height:ROW_H}}/>
      </div>
    </div>
  );
}

function SerifTimePicker({hour, minute, ampm, onChange}){
  const hours = Array.from({length:12}, (_,i)=>String(i+1));
  const minutes = Array.from({length:12}, (_,i)=>String(i*5).padStart(2,'0'));
  const ampms = ['AM','PM'];
  const setH = (v)=>onChange({hour:parseInt(v,10), minute, ampm});
  const setM = (v)=>onChange({hour, minute:parseInt(v,10), ampm});
  const setA = (v)=>onChange({hour, minute, ampm:v});
  return (
    <div style={{display:'flex',gap:10,alignItems:'center',justifyContent:'flex-start'}}>
      <WheelColumn value={String(hour||7)} options={hours} onChange={setH}/>
      <span className="serif" style={{fontSize:24,color:'var(--muted)'}}>:</span>
      <WheelColumn value={String(minute||0).padStart(2,'0')} options={minutes} onChange={setM}/>
      <WheelColumn value={ampm||'AM'} options={ampms} onChange={setA} width={62}/>
    </div>
  );
}

    const today=new Date(); today.setHours(0,0,0,0);

function MeetingsListScreen(){
  const nav=useNav();
  const [view,setView]=useState('mine');
  const {meetings}=useMeetings();

  // Sort by next occurrence
  const withNext = meetings.map(m=>({m, next: nextOccurrence(m)})).sort((a,b)=>{
    if(!a.next) return 1;
    if(!b.next) return -1;
    return a.next.getTime()-b.next.getTime();
  });
  const todayMidnight = new Date(); todayMidnight.setHours(0,0,0,0);
  const tomorrowMidnight = new Date(todayMidnight); tomorrowMidnight.setDate(todayMidnight.getDate()+1);
  const tonight = withNext.filter(({next})=>next && next < tomorrowMidnight).map(x=>x.m);
  const thisWeek = withNext.filter(({next})=>next && next >= tomorrowMidnight).map(x=>x.m);

  if(view==='online') return <OnlineMeetingsScreen onBack={()=>setView('mine')}/>;

  return (
    <>
      <AppBar eyebrow="Fellowship" title="Meetings" right={<ButtonText onClick={()=>nav.push('add')}>+ add</ButtonText>}/>
      <ScreenBody>
        <section style={{padding:'8px 24px 0'}}>
          <SegPills value={view} onChange={setView} options={[
            {value:'mine',label:'My meetings'},
            {value:'find',label:'Find nearby'},
            {value:'online',label:'Online'},
          ]}/>
        </section>
        {tonight.length>0&&(
          <section style={{padding:'22px 0 0'}}>
            <Eyebrow style={{padding:'0 24px',marginBottom:14}}>Today</Eyebrow>
            {tonight.map(m=><MeetingRow key={m.id} m={m} hero/>)}
          </section>
        )}
        {thisWeek.length>0 && <Hairline style={{margin:'24px 24px 0'}}/>}
        {thisWeek.length>0 && (
          <section style={{padding:'22px 0 0'}}>
            <Eyebrow style={{padding:'0 24px',marginBottom:14}}>This week · {thisWeek.length} meetings</Eyebrow>
            {thisWeek.map(m=><MeetingRow key={m.id} m={m}/>)}
          </section>
        )}
        {meetings.length===0 && (
          <section style={{padding:'24px'}}>
            <NoteBox>You haven't added any meetings yet. Tap <em>+ add</em> to create your first one.</NoteBox>
          </section>
        )}
        <Hairline style={{margin:'32px 24px 0'}}/>
        <section style={{padding:'24px'}}>
          <Eyebrow style={{marginBottom:12}}>Discover</Eyebrow>
          <Pressable onClick={()=>setView('online')} style={{display:'flex',alignItems:'center',gap:14,padding:'14px 0',borderBottom:'1px solid var(--rule-soft)'}}>
            <div style={{flex:1,minWidth:0}}>
              <div className="serif" style={{fontSize:17}}>SA Online intergroup</div>

            </div>
            <span className="serif" style={{color:'var(--muted)',fontSize:18}}>›</span>
          </Pressable>
          <Pressable onClick={()=>window.open('https://www.sa.org/meetings/?tsml-day=any&tsml-type=ONL','_blank')} style={{display:'flex',alignItems:'center',gap:14,padding:'14px 0'}}>
            <div style={{flex:1,minWidth:0}}>

            <span className="serif" style={{color:'var(--muted)',fontSize:18}}>›</span>

        </section>
      </ScreenBody>

  );
}
