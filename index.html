*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}

/* When installed as standalone PWA, paint the viewport background with the warm paper
   tone so black-translucent iOS status bar shows our cream, not white. The AppBar
   already pads its own content with env(safe-area-inset-top), so layout stays put. */
@media (display-mode:standalone){
  html,body{ background:#f4eee4; }

/* ── RESPONSIVE SHELL ── */

/* Phone default: centered narrow card */
.sw-outer{
  min-height:100vh;width:100%;
  background:#e8e3da;
  display:flex;justify-content:center;align-items:stretch;
}
.sw-card{
  width:100%;max-width:430px;min-height:100vh;
  position:relative;overflow:hidden;
  box-shadow:0 0 0 1px rgba(60,40,20,0.08),0 30px 80px rgba(60,40,20,0.12);
  display:flex;flex-direction:column;
}

/* TabBar visible on phone, hidden on tablet+ */
.sw-tabbar{ display:block; }
.sw-sidebar{ display:none; }

/* ≥ 600px: sidebar layout (catches iPad Split View narrow column too) */
@media (min-width:600px){
  html,body{ background:#efe9de; }
  .sw-outer{
    background:#efe9de;
    justify-content:flex-start;
    align-items:flex-start;
  }
  .sw-card{
    flex-direction:row;
    max-width:none;
    width:100%;
    min-height:100vh;
    box-shadow:none;
    border-radius:0;
  }
  .sw-tabbar{ display:none !important; }
  .sw-sidebar{ display:flex; }
  .sw-content{
    flex:1;
    max-width:760px;
    display:flex;
    flex-direction:column;
    min-height:100vh;
    border-left:1px solid var(--rule);
  }
}

/* 600–767px: compact sidebar so the content column still has room (Split View) */
@media (min-width:600px) and (max-width:767px){
  .sw-sidebar{ width:200px !important; }
}

/* ≥ 1200px: wider sidebar */
@media (min-width:1200px){
  .sw-sidebar{ width:280px !important; }
  .sw-content{ max-width:820px; }
}

/* ≥ 1440px: page-on-desk — outer margin + hairline */
@media (min-width:1440px){
  .sw-outer{
    padding:32px;
    align-items:flex-start;
    justify-content:center;
  }
  .sw-card{
    border-radius:12px;
    border:1px solid var(--rule);
    overflow:hidden;
    min-height:calc(100vh - 64px);
    box-shadow:0 2px 8px rgba(60,40,20,0.06);
  }
}
</style>

/* ── NAV ── */
const NavContext = createContext(null);
function useNav(){ return useContext(NavContext); }

function NavProvider({children}){
  const [tab,setTab] = useState('home');
  const [stacks,setStacks] = useState({
    home:['home'], steps:['overview'], meet:['list'], people:['list'], more:['root'],
  });
  const switchTab = useCallback((next)=>{
    if(next===tab) setStacks(s=>({...s,[next]:[s[next][0]]}));
    else setTab(next);
  },[tab]);
  const push = useCallback((screen,params)=>{
    setStacks(s=>{const top=s[tab].slice(); top.push(params?{screen,params}:screen); return{...s,[tab]:top};});
  },[tab]);
  const back = useCallback(()=>{
    setStacks(s=>{const top=s[tab].slice(); if(top.length>1)top.pop(); return{...s,[tab]:top};});
  },[tab]);
  const goto = useCallback((nextTab,screen,params)=>{
    setTab(nextTab);
    setStacks(s=>({...s,[nextTab]:[s[nextTab][0],params?{screen,params}:screen].filter((v,i,a)=>i===0||(typeof v==='string'?v!==a[0]:true))}));
  },[]);
  const currentStack=stacks[tab];
  const currentEntry=currentStack[currentStack.length-1];
  const current=typeof currentEntry==='string'?currentEntry:currentEntry.screen;
  const params=typeof currentEntry==='string'?{}:currentEntry.params;
  const canBack=currentStack.length>1;
  return (
    <NavContext.Provider value={{tab,current,params,canBack,switchTab,push,back,goto}}>
      {children}
    </NavContext.Provider>
  );
}

const ProfileContext = createContext(null);

const PROFILE_KEY = 'sw_profile';
const DEFAULT_PROFILE = { name:'', sobrietyDate:'', homeGroup:'', program:'' };

function loadProfile(){
  try{
    const s = localStorage.getItem(PROFILE_KEY);
    return s ? { ...DEFAULT_PROFILE, ...JSON.parse(s) } : { ...DEFAULT_PROFILE };
  }catch{ return { ...DEFAULT_PROFILE }; }
}
function saveProfile(p){
  try{ localStorage.setItem(PROFILE_KEY, JSON.stringify(p)); }catch{}
}

/** Days sober from a sobriety date string (ISO or human). Returns 0 if invalid/missing. */
function computeSoberDays(dateStr){
  if(!dateStr) return 0;
  const d = new Date(dateStr);
  if(isNaN(d.getTime())) return 0;
  const diff = Math.floor((Date.now() - d.getTime())/(1000*60*60*24));
  return Math.max(0, diff);
}

/** First letter for avatars; falls back to a dot. */
function profileInitial(name){
  return (name||'').replace(/[^A-Za-z]/g,'')[0] || '·';
}

/** Display name; falls back to a neutral placeholder. */
function displayName(p){ return p && p.name ? p.name : 'You'; }

/** Friendly date for "since …" labels. */
function formatSinceDate(dateStr){
  if(!dateStr) return '';
  const d = new Date(dateStr);
  if(isNaN(d.getTime())) return dateStr;
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
}

/* ── CONTACTS (sponsor / sponsee / fellowship) ── */

function loadContacts(){

    if(s) return JSON.parse(s);
  }catch{}

    id:c.id, name:c.name, role:c.role,
    phone:c.phone||'', email:'',
    tagLine:c.note||'', notes:'', howWeMet:'',
  }));
}
function saveContacts(arr){ try{ localStorage.setItem(CONTACTS_KEY, JSON.stringify(arr)); }catch{} }

function uid(prefix='c'){ return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

const ContactsContext = createContext(null);
function useContacts(){ return useContext(ContactsContext); }

function ContactsProvider({children}){
  const [contacts, setContactsState] = useState(loadContacts);
  const persist = useCallback((next)=>{ saveContacts(next); setContactsState(next); },[]);
  const addContact = useCallback((c)=>{
    const id = uid('c');
    setContactsState(prev=>{
      let next = [...prev, {id, name:'', role:'Fellowship', phone:'', email:'', tagLine:'', notes:'', howWeMet:'', ...c, id}];
      // Enforce single sponsor: if the new one is sponsor, demote others
      if(c.role==='Sponsor'){
        next = next.map(x=>x.id===id?x:(x.role==='Sponsor'?{...x,role:'Fellowship'}:x));
      }
      saveContacts(next);
      return next;
    });
    return id;
  },[]);
  const updateContact = useCallback((id, patch)=>{
    setContactsState(prev=>{
      let next = prev.map(c=>c.id===id?{...c,...patch}:c);
      if(patch.role==='Sponsor'){
        next = next.map(c=>c.id===id?c:(c.role==='Sponsor'?{...c,role:'Fellowship'}:c));
      }
      saveContacts(next);
      return next;
    });
  },[]);
  const removeContact = useCallback((id)=>{
    setContactsState(prev=>{ const next = prev.filter(c=>c.id!==id); saveContacts(next); return next; });
  },[]);
  const sponsor = contacts.find(c=>c.role==='Sponsor') || null;
  return (
    <ContactsContext.Provider value={{contacts, addContact, updateContact, removeContact, sponsor}}>
      {children}
    </ContactsContext.Provider>
  );
}

const DAYS_OF_WEEK = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

    host:m.host||'', notes:m.notes||'',
  }));
}

function buildZoomUrl(meetingId, passcode){
  const id = (meetingId||'').replace(/\s+/g,'');
  if(!id) return '';
  const enc = encodeURIComponent(passcode||'');
  return passcode
    ? `https://zoom.us/j/${id}?pwd=${enc}`
    : `https://zoom.us/j/${id}`;
}

/** to24h(7,0,'PM') -> {h:19,m:0} */
function to24h(h, m, ampm){
  let hh = parseInt(h,10) || 0;
  if(ampm==='PM' && hh<12) hh+=12;
  if(ampm==='AM' && hh===12) hh=0;
  return {h:hh, m: parseInt(m,10)||0};
}
function fmt12h(h, m, ampm){
  const mm = String(parseInt(m,10)||0).padStart(2,'0');
  return `${parseInt(h,10)||12}:${mm} ${ampm}`;
}

/** Next occurrence Date for a weekly meeting at given hour/min on given weekdays */
function nextOccurrence(meeting){
  if(!meeting.weekdays || meeting.weekdays.length===0) return null;
  const {h,m} = to24h(meeting.hour, meeting.minute, meeting.ampm);
  const now = new Date();
  for(let i=0;i<8;i++){
    const d = new Date(now);
    d.setDate(now.getDate()+i);
    d.setHours(h, m, 0, 0);
    if(meeting.weekdays.includes(d.getDay()) && d.getTime() > now.getTime()){
      return d;
    }
  }
  return null;
}
function weekdayBadge(weekdays){
  if(!weekdays || weekdays.length===0) return '—';
  if(weekdays.length===7) return 'Daily';
  return weekdays.slice().sort().map(d=>DAYS_SHORT[d]).join('·');
}

/** The "practice day key" — accounts for the configurable reset hour.
 *  If reset is 04:00, then 02:30 AM still belongs to yesterday's key. */
function practiceDayKey(resetHour=4, resetMinute=0, now=new Date()){
  const d = new Date(now);
  // Subtract the reset offset; the resulting calendar date is today's key.
  d.setHours(d.getHours() - resetHour);
  d.setMinutes(d.getMinutes() - resetMinute);
  const yyyy = d.getFullYear();
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const dd = String(d.getDate()).padStart(2,'0');
  return `${yyyy}-${mm}-${dd}`;
}

  const updateDay = useCallback((dayKey, patch)=>{
    setDailyState(prev=>{
      const cur = prev[dayKey] || { intention:'', morningChecks:[], eveningChecks:{}, eveningNotes:'' };
      const next = { ...prev, [dayKey]: { ...cur, ...patch } };
      saveDaily(next);
      return next;

  const toggleMorning = useCallback((dayKey, idx)=>{
    setDailyState(prev=>{
      const cur = prev[dayKey] || { intention:'', morningChecks:[], eveningChecks:{}, eveningNotes:'' };
      const set = new Set(cur.morningChecks||[]);
      if(set.has(idx)) set.delete(idx); else set.add(idx);
      const next = { ...prev, [dayKey]: { ...cur, morningChecks:[...set].sort((a,b)=>a-b) } };
      saveDaily(next);
      return next;
    });
  },[]);
  /** Toggle a single evening-review index. */
  const toggleEvening = useCallback((dayKey, idx)=>{
    setDailyState(prev=>{

      const checks = { ...(cur.eveningChecks||{}) };
      checks[idx] = !checks[idx];
      const next = { ...prev, [dayKey]: { ...cur, eveningChecks: checks } };
      saveDaily(next);
      return next;
    });
  },[]);
  const removeDay = useCallback((dayKey)=>{
    setDailyState(prev=>{ const next = { ...prev }; delete next[dayKey]; saveDaily(next); return next; });

/* ── PIN LOCK ── */
const PIN_KEY = 'sw_pin';      // { hash, salt, question, answerHash }
const PIN_VERSION = 1;

async function sha256(str){
  const buf = new TextEncoder().encode(str);
  const hash = await crypto.subtle.digest('SHA-256', buf);
  return Array.from(new Uint8Array(hash)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function randomSalt(){
  const arr = new Uint8Array(16);
  crypto.getRandomValues(arr);
  return Array.from(arr).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function loadPin(){
  try{ const s=localStorage.getItem(PIN_KEY); return s?JSON.parse(s):null; }
  catch{ return null; }
}
function savePin(o){ try{ localStorage.setItem(PIN_KEY, JSON.stringify(o)); }catch{} }

/* ── BACKUP CRYPTO (AES-GCM, key derived from PIN via PBKDF2) ── */
const BACKUP_VERSION = 1;
const BACKUP_STORE_KEYS = [PROFILE_KEY, CONTACTS_KEY, MEETINGS_KEY, PRACTICE_KEY, DAILY_KEY, STEPS_KEY, READINGS_KEY, REMINDERS_KEY, UI_SETTINGS_KEY];
const BACKUP_HISTORY_KEY = 'sw_backup_history';

async function deriveBackupKey(pin, salt){
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey('raw', enc.encode(pin), {name:'PBKDF2'}, false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name:'PBKDF2', salt: enc.encode(salt), iterations: 250000, hash:'SHA-256' },
    base,
    { name:'AES-GCM', length:256 },
    false,
    ['encrypt','decrypt']
  );
}

async function encryptBackup(pin){
  const stored = loadPin();
  if(!stored) throw new Error('Set a PIN before exporting a backup.');
  const data = {};
  BACKUP_STORE_KEYS.forEach(k=>{
    const v = localStorage.getItem(k);
    if(v!==null) data[k] = v;
  });
  const plaintext = new TextEncoder().encode(JSON.stringify(data));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const salt = stored.salt; // reuse PIN salt so import knows how to derive
  const key = await deriveBackupKey(pin, salt);
  const cipher = new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, plaintext));
  const b64 = (bytes)=>btoa(String.fromCharCode(...bytes));
  return {
    version: BACKUP_VERSION,
    created: new Date().toISOString(),
    salt,
    iv: b64(iv),
    cipher: b64(cipher),
  };
}

async function decryptBackup(blob, pin){
  if(!blob || !blob.cipher || !blob.iv || !blob.salt) throw new Error('Not a valid Step Work backup.');
  const fromB64 = (s)=>Uint8Array.from(atob(s), c=>c.charCodeAt(0));
  const key = await deriveBackupKey(pin, blob.salt);
  let plaintext;
  try{
    plaintext = await crypto.subtle.decrypt({name:'AES-GCM', iv:fromB64(blob.iv)}, key, fromB64(blob.cipher));
  }catch(e){ throw new Error('Wrong PIN or corrupted file.'); }
  const obj = JSON.parse(new TextDecoder().decode(plaintext));
  return obj;
}

function recordBackup(name, sizeBytes){
  try{
    const list = JSON.parse(localStorage.getItem(BACKUP_HISTORY_KEY)||'[]');
    list.unshift({name, when:new Date().toISOString(), bytes:sizeBytes});
    localStorage.setItem(BACKUP_HISTORY_KEY, JSON.stringify(list.slice(0,8)));
  }catch{}
}
function loadBackupHistory(){
  try{ return JSON.parse(localStorage.getItem(BACKUP_HISTORY_KEY)||'[]'); }catch{ return []; }
}

  useEffect(()=>{ setUnlocked(false); },[]);

  if(!stored) return <PinSetup onDone={(o)=>{ savePin(o); setStored(o); setUnlocked(true); }}/>;

}

function PinSetup({onDone}){
  const [step, setStep] = useState('intro');   // intro | enter | confirm | question | warn
  const [pin1, setPin1] = useState('');
  const [pin2, setPin2] = useState('');
  const [question, setQuestion] = useState('');
  const [answer, setAnswer] = useState('');
  const [err, setErr] = useState('');

  const finish = async (withQ)=>{
    const salt = randomSalt();
    const hash = await sha256(salt + pin1);
    const out = { version:PIN_VERSION, salt, hash };
    if(withQ && question.trim() && answer.trim()){
      out.question = question.trim();
      out.answerHash = await sha256(salt + answer.trim().toLowerCase());
    }
    onDone(out);
  };

  if(step==='intro') return (
    <PinShell eyebrow="Welcome" title="Set a PIN" subtitle="A short number that protects this app on your device. You'll enter it each time you open the app.">
      <div style={{textAlign:'center',marginTop:8}}>
        <button onClick={()=>setStep('enter')} style={{padding:'12px 28px',borderRadius:999,background:'var(--ink)',color:'var(--paper)',border:0,cursor:'pointer',fontFamily:'Newsreader,Georgia,serif',fontSize:16}}>Begin</button>
      </div>

    <PinShell eyebrow="Step 1 of 2" title="Choose a PIN" subtitle="4 to 6 digits. Pick something you'll remember.">
      <PinKeypad value={pin1} onChange={(v)=>{setPin1(v);setErr('');}} />
      {err && <p style={{textAlign:'center',color:'#a04030',fontStyle:'italic',marginTop:12}}>{err}</p>}
      <div style={{textAlign:'center',marginTop:24}}>
        <button disabled={pin1.length<4} onClick={()=>{ setStep('confirm'); }}
          style={{padding:'10px 24px',borderRadius:999,background:pin1.length>=4?'var(--ink)':'var(--rule)',color:'var(--paper)',border:0,cursor:pin1.length>=4?'pointer':'not-allowed',fontFamily:'Newsreader,Georgia,serif',fontSize:15}}>Continue →</button>
      </div>
    </PinShell>
  );

  if(step==='confirm') return (
    <PinShell eyebrow="Step 2 of 2" title="Confirm your PIN" subtitle="Enter the same digits again.">
      <PinKeypad value={pin2} onChange={(v)=>{setPin2(v);setErr('');}} />
      {err && <p style={{textAlign:'center',color:'#a04030',fontStyle:'italic',marginTop:12}}>{err}</p>}
      <div style={{textAlign:'center',marginTop:24,display:'flex',justifyContent:'center',gap:12}}>
        <button onClick={()=>{ setPin1(''); setPin2(''); setStep('enter'); }}
          style={{padding:'10px 20px',borderRadius:999,background:'transparent',color:'var(--ink)',border:'1px solid var(--rule)',cursor:'pointer',fontFamily:'Newsreader,Georgia,serif',fontSize:14}}>Start over</button>
        <button disabled={pin2.length<4} onClick={()=>{
          if(pin1!==pin2){ setErr("PINs don't match — try once more."); setPin2(''); return; }
          setStep('question');
        }}
          style={{padding:'10px 24px',borderRadius:999,background:pin2.length>=4?'var(--ink)':'var(--rule)',color:'var(--paper)',border:0,cursor:pin2.length>=4?'pointer':'not-allowed',fontFamily:'Newsreader,Georgia,serif',fontSize:15}}>Continue →</button>
      </div>
    </PinShell>
  );

  if(step==='question') return (
    <PinShell eyebrow="Optional" title="Recovery question" subtitle="If you forget your PIN, the only way back in is the answer to a question you set now. You can also skip — but if you forget the PIN there will be no way to recover your data.">

        <div className="eyebrow" style={{marginBottom:6}}>Question</div>
        <input value={question} onChange={(e)=>setQuestion(e.target.value)} placeholder="e.g. What street did I grow up on?"

      </div>
      <div style={{textAlign:'center',marginTop:28,display:'flex',justifyContent:'center',gap:12}}>
        <button onClick={()=>setStep('warn')}
          style={{padding:'10px 20px',borderRadius:999,background:'transparent',color:'var(--muted)',border:'1px solid var(--rule)',cursor:'pointer',fontFamily:'Newsreader,Georgia,serif',fontSize:14}}>Skip</button>

      </div>

function PinUnlock({stored, onUnlock, onReset}){
  const [pin, setPin] = useState('');
  const [err, setErr] = useState('');
  const [attempts, setAttempts] = useState(0);
  const [delayUntil, setDelayUntil] = useState(0);
  const [showRecovery, setShowRecovery] = useState(false);
  const [answer, setAnswer] = useState('');
  const [recoveryErr, setRecoveryErr] = useState('');
  const [tick, setTick] = useState(0);

  // tick to refresh the remaining-delay countdown
  useEffect(()=>{
    if(delayUntil<=Date.now()) return;
    const t = setInterval(()=>setTick(n=>n+1), 500);
    return ()=>clearInterval(t);
  },[delayUntil]);

  const tryPin = async (entered)=>{
    if(Date.now()<delayUntil){ setErr('Please wait before trying again.'); return; }
    const hash = await sha256(stored.salt + entered);
    if(hash===stored.hash){ onUnlock(); return; }
    const n = attempts+1;
    setAttempts(n);
    setPin('');
    setErr("That PIN didn't match.");
    if(n>=3){
      const wait = Math.min(60, 2**(n-2)) * 1000; // 2s, 4s, 8s, 16s, 32s, 60s…
      setDelayUntil(Date.now()+wait);
    }
  };

  const tryRecovery = async ()=>{
    if(!stored.answerHash){ return; }
    const h = await sha256(stored.salt + answer.trim().toLowerCase());
    if(h===stored.answerHash){
      if(confirm('Recovery accepted. The PIN will be cleared so you can set a new one. Continue?')){
        onReset();
      }
    }else{
      setRecoveryErr("That answer didn't match.");
    }
  };

  // Auto-submit at 6 digits, allow manual submit at 4+
  useEffect(()=>{
    if(pin.length===6) tryPin(pin);
    // eslint-disable-next-line
  },[pin]);

  const remaining = Math.max(0, Math.ceil((delayUntil-Date.now())/1000));

  if(showRecovery && stored.question) return (
    <PinShell eyebrow="Recovery" title="Answer your security question" subtitle={stored.question}>
      <input value={answer} onChange={(e)=>{setAnswer(e.target.value);setRecoveryErr('');}}
        autoFocus
        style={{width:'100%',padding:'10px 0',background:'transparent',border:0,borderBottom:'1px solid var(--rule)',fontFamily:'Newsreader,Georgia,serif',fontSize:17,color:'var(--ink)',outline:'none',marginTop:12}}/>
      {recoveryErr && <p style={{textAlign:'center',color:'#a04030',fontStyle:'italic',marginTop:12}}>{recoveryErr}</p>}
      <div style={{textAlign:'center',marginTop:24,display:'flex',justifyContent:'center',gap:12}}>
        <button onClick={()=>setShowRecovery(false)} style={{padding:'10px 20px',borderRadius:999,background:'transparent',color:'var(--muted)',border:'1px solid var(--rule)',cursor:'pointer',fontFamily:'Newsreader,Georgia,serif',fontSize:14}}>Back</button>
        <button disabled={!answer.trim()} onClick={tryRecovery} style={{padding:'10px 24px',borderRadius:999,background:answer.trim()?'var(--ink)':'var(--rule)',color:'var(--paper)',border:0,cursor:answer.trim()?'pointer':'not-allowed',fontFamily:'Newsreader,Georgia,serif',fontSize:15}}>Reset PIN →</button>
      </div>
    </PinShell>
  );

  return (
    <PinShell eyebrow="Locked" title="Enter your PIN">
      <PinKeypad value={pin} onChange={(v)=>{setPin(v);setErr('');}} />
      {err && <p style={{textAlign:'center',color:'#a04030',fontStyle:'italic',marginTop:12}}>{err}</p>}
      {remaining>0 && <p style={{textAlign:'center',color:'var(--muted)',fontStyle:'italic',marginTop:8}}>Try again in {remaining}s</p>}
      <div style={{textAlign:'center',marginTop:16}}>
        <button disabled={pin.length<4||remaining>0} onClick={()=>tryPin(pin)} style={{padding:'8px 20px',borderRadius:999,background:(pin.length>=4&&remaining<=0)?'var(--ink)':'var(--rule)',color:'var(--paper)',border:0,cursor:(pin.length>=4&&remaining<=0)?'pointer':'not-allowed',fontFamily:'Newsreader,Georgia,serif',fontSize:14}}>Unlock</button>
      </div>
      {stored.question && (
        <div style={{textAlign:'center',marginTop:22}}>
          <button onClick={()=>setShowRecovery(true)} style={{background:'transparent',border:0,cursor:'pointer',color:'var(--terra-ink)',fontFamily:'Newsreader,Georgia,serif',fontStyle:'italic',fontSize:14}}>Forgot PIN?</button>
        </div>
      )}
    </PinShell>
  );
}

}

/* ── STEPS TAB ── */
function statusLabel(s){
  if(s.status==='done')return ' · complete';
  if(s.status==='progress')return ' · in progress';
  if(s.status==='next')return ' · next up';
  return '';
}
function statusBadge(status){
  const m={done:{color:'var(--sage)',label:'done'},progress:{color:'var(--terra-ink)',label:'6 / 14'},next:{color:'var(--terra-ink)',label:'begin'},pending:{color:'var(--faint)',label:'—'}}[status];
  return <Stamp color={m.color}>{m.label}</Stamp>;
}

function StepsOverviewScreen(){
  const nav=useNav();
  const {steps, setSectionStatus} = useSteps();
  const groups=[
    {step:'Step 4 — Inventory',ids:['lists','causes','faults','fear1','fear2','sex']},
    {step:'Steps 8 & 9 — Amends',ids:['eighth']},
  ];
  /** Compute a section's current state: 'done' (user marked), 'progress' (auto from data), 'undone'. */
  const inferStatus = (id) => {
    const override = (steps.sectionStatus||{})[id];
    if(override) return override; // user-set
    // auto from data presence
    if(id==='lists' && steps.resentments.length>0) return 'progress';
    if(id==='causes' && steps.causes.length>0) return 'progress';
    if(id==='faults' && steps.faults.length>0) return 'progress';
    if(id==='fear1' && steps.fears.length>0) return 'progress';
    if(id==='eighth' && steps.amends.length>0) return 'progress';
    return 'undone';
  };
  const cycleStatus = (id, e) => {
    e.stopPropagation();
    const cur = inferStatus(id);
    const order = ['undone','progress','done'];
    const next = order[(order.indexOf(cur)+1) % order.length];
    setSectionStatus(id, next);
  };
  const sectionStatusBadge = (status) => {
    const m = {
      done:    {color:'var(--sage)',     label:'done'},
      progress:{color:'var(--terra-ink)',label:'in progress'},
      undone:  {color:'var(--faint)',    label:'not started'},
    }[status];
    return <Stamp color={m.color}>{m.label}</Stamp>;
  };
  const doneCount = STEP_SECTIONS.filter(s=>inferStatus(s.id)==='done').length;
  return (
    <>
      <AppBar eyebrow="The work" title="Steps 4 through 9" right={<Stamp>{doneCount} of {STEP_SECTIONS.length} done</Stamp>}/>
      <ScreenBody>
        <section style={{padding:'4px 24px 28px'}}>
          <p className="serif" style={{fontSize:16,lineHeight:1.55,color:'var(--ink-2)',fontStyle:'italic',textWrap:'pretty',margin:0}}>One section at a time, in the order the Book presents it. Discuss each with your sponsor before moving on. Tap the status pill to mark a section done — or undone to revisit.</p>
        </section>
        {groups.map((g,gi)=>(
          <Fragment key={g.step}>
            <Hairline/>
            <section style={{padding:'24px 24px 8px'}}>
              <Eyebrow style={{marginBottom:18}}>{g.step}</Eyebrow>
              {g.ids.map((id)=>{
                const s=STEP_SECTIONS.find(x=>x.id===id);
                const status=inferStatus(id);
                return (
                  <div key={id} style={{display:'flex',alignItems:'flex-start',gap:14,padding:'16px 0',borderBottom:'1px solid var(--rule-soft)'}}>
                    <span className="serif" style={{fontSize:12,color:'var(--terra)',fontStyle:'italic',width:22,marginTop:6,fontVariantNumeric:'oldstyle-nums'}}>{s.roman}.</span>
                    <Pressable onClick={()=>nav.push(id)} style={{flex:1,padding:0,textAlign:'left'}}>
                      <div className="serif" style={{fontSize:19,fontWeight:400,lineHeight:1.2,color:status==='undone'?'var(--muted)':'var(--ink)',textDecoration:status==='done'?'line-through':'none',textDecorationColor:'var(--sage)'}}>{s.title}</div>
                      <Stamp style={{marginTop:3,display:'block'}}>{s.pg}</Stamp>
                    </Pressable>
                    <Pressable onClick={(e)=>cycleStatus(id,e)} style={{padding:'6px 10px',marginTop:2,borderRadius:999,border:'1px solid var(--rule-soft)'}}>
                      {sectionStatusBadge(status)}
                    </Pressable>
                    <Pressable onClick={()=>nav.push(id)} style={{padding:'6px 4px',marginTop:6}}>
                      <span className="serif" style={{color:'var(--muted)',fontSize:18}}>›</span>
                    </Pressable>
                  </div>
                );
              })}
            </section>
          </Fragment>
        ))}
        <Hairline/>
        <section style={{padding:'24px'}}>
          <Eyebrow style={{marginBottom:12}}>Sponsor</Eyebrow>
          <Pressable onClick={()=>nav.goto('more','sponsor')} style={{padding:'14px 16px',border:'1px solid var(--rule)',borderRadius:8,display:'flex',alignItems:'center',gap:12}}>
            <div style={{flex:1}}>
              <div className="serif" style={{fontSize:16}}>Sponsor sharing</div>
              <Stamp style={{marginTop:2,display:'block'}}>2 sections shared · last update 5 days ago</Stamp>
            </div>
            <ButtonText style={{padding:0}}>open →</ButtonText>
          </Pressable>
        </section>
      </ScreenBody>
    </>
  );
}

function ResentmentAddScreen(){
  const nav=useNav();
  const {steps, addItem, addItems, updateItem} = useSteps();
  const existing=nav.params&&nav.params.id?steps.resentments.find(r=>r.id===nav.params.id):null;
  const isEdit = !!existing;

  // Names already on the list (lowercased), excluding the one being edited — for dedupe warnings.
  const existingNames = React.useMemo(()=>new Set(
    steps.resentments.filter(r=>!existing||r.id!==existing.id).map(r=>r.name.trim().toLowerCase())
  ),[steps.resentments, existing]);

  // Edit mode: single row
  const [name,setName]=useState(existing?existing.name:'');
  const [type,setType]=useState(existing?existing.type:'Person');
  const [note,setNote]=useState(existing?existing.note:'');
  const nameDup = name.trim() && existingNames.has(name.trim().toLowerCase());

  // Add mode: multi-row table — pick type once, then enter many names
  const [bulkType, setBulkType] = useState('Person');
  const [rows, setRows] = useState(() => Array.from({length:5}, ()=>({name:'',note:''})));

  const saveSingle = ()=>{
    if(!name.trim()){ alert('Please add a name before saving.'); return; }
    if(nameDup && !confirm(`"${name.trim()}" is already on the list. Add it anyway?`)) return;
    updateItem('resentments', existing.id, {name:name.trim(), type, note:note.trim()});
    nav.back();
  };
  const saveBulk = ()=>{
    const valid = rows.filter(r=>r.name.trim());
    if(valid.length===0){ alert('Add at least one name before saving.'); return; }
    const dups = valid.filter(r=>existingNames.has(r.name.trim().toLowerCase())).map(r=>r.name.trim());
    if(dups.length && !confirm(`Already on the list: ${dups.join(', ')}.\n\nSave anyway?`)) return;
    addItems('resentments', valid.map(r=>({name:r.name.trim(), type:bulkType, note:r.note.trim()})));
    nav.back();
  };
  const updateRow = (i, field, v) => setRows(prev=>{ const n=[...prev]; n[i]={...n[i],[field]:v}; return n; });
  const addRow = ()=>setRows(prev=>[...prev,{name:'',note:''}]);
  const removeRow = (i)=>setRows(prev=>prev.length>1?prev.filter((_,k)=>k!==i):prev);

  if(isEdit) return (
    <>
      <AppBar eyebrow="Edit entry" title="A name comes to mind" right={<ButtonText onClick={saveSingle}>save →</ButtonText>}/>
      <ScreenBody>
        <section style={{padding:'12px 24px 24px'}}>
          <Eyebrow style={{marginBottom:4}}>Name or description</Eyebrow>
          <SerifInput value={name} onChange={setName} autoFocus placeholder="e.g. Dad, Mrs. K., the court…"/>
          {nameDup && <p className="serif" style={{fontSize:13,color:'var(--terra-ink)',fontStyle:'italic',marginTop:6}}>Already on your list — you can still save it.</p>}
          <div style={{marginTop:32}}>
            <Eyebrow style={{marginBottom:12}}>What are they?</Eyebrow>
            <SegPills value={type} onChange={setType} options={[{value:'Person',label:'Person'},{value:'Institution',label:'Institution'},{value:'Principle',label:'Principle'}]}/>
          </div>
          <div style={{marginTop:32}}>
            <Eyebrow style={{marginBottom:4}}>Note <Stamp style={{marginLeft:8}}>optional</Stamp></Eyebrow>
            <SerifInput value={note} onChange={setNote} placeholder="family · work · legal · childhood…"/>
          </div>
        </section>
      </ScreenBody>
    </>
  );

  const filledCount = rows.filter(r=>r.name.trim()).length;

  return (
    <>
      <AppBar eyebrow="New entries" title="Names come to mind" right={<ButtonText onClick={saveBulk}>save {filledCount>0?`(${filledCount}) `:''}→</ButtonText>}/>
      <ScreenBody>
        <section style={{padding:'12px 24px 0'}}>
          <p className="serif" style={{fontSize:14,color:'var(--muted)',fontStyle:'italic',lineHeight:1.55,textWrap:'pretty',margin:0}}>
            Pick a category, then add as many names as come to mind. Don't edit. Don't qualify. Tap "+ add row" to keep going.
          </p>
          <div style={{marginTop:24}}>
            <Eyebrow style={{marginBottom:12}}>What are they?</Eyebrow>
            <SegPills value={bulkType} onChange={setBulkType} options={[
              {value:'Person',label:'Person'},
              {value:'Institution',label:'Institution'},
              {value:'Principle',label:'Principle'},
            ]}/>
          </div>
        </section>
        <section style={{padding:'28px 0 0'}}>
          <div style={{display:'grid',gridTemplateColumns:'28px 1fr 1fr 32px',gap:8,padding:'0 16px 8px',borderBottom:'1px solid var(--rule)'}}>
            <span/>
            <Eyebrow>Name</Eyebrow>
            <Eyebrow>Note · optional</Eyebrow>
            <span/>
          </div>
          {rows.map((row,i)=>{
            const rowDup = row.name.trim() && existingNames.has(row.name.trim().toLowerCase());
            return (
            <div key={i} style={{display:'grid',gridTemplateColumns:'28px 1fr 1fr 32px',gap:8,padding:'10px 16px',borderBottom:'1px solid var(--rule-soft)',alignItems:'center'}}>
              <span className="serif" style={{fontSize:13,color:'var(--muted)',fontVariantNumeric:'oldstyle-nums',textAlign:'right'}}>{i+1}</span>
              <div style={{minWidth:0}}>
                <input value={row.name} onChange={(e)=>updateRow(i,'name',e.target.value)}
                  placeholder="Dad, Mrs. K., the court…" autoFocus={i===0}
                  style={{width:'100%',padding:'8px 0',background:'transparent',border:0,borderBottom:'1px solid var(--rule-soft)',fontFamily:'Newsreader,Georgia,serif',fontSize:16,color:'var(--ink)',outline:'none'}}/>
                {rowDup && <span className="serif" style={{fontSize:12,color:'var(--terra-ink)',fontStyle:'italic'}}>already on list</span>}
              </div>
              <input value={row.note} onChange={(e)=>updateRow(i,'note',e.target.value)}
                placeholder="family · work · legal…"
                style={{padding:'8px 0',background:'transparent',border:0,borderBottom:'1px solid var(--rule-soft)',fontFamily:'Newsreader,Georgia,serif',fontSize:15,color:'var(--ink-2)',outline:'none'}}/>
              <Pressable onClick={()=>removeRow(i)} style={{padding:'4px 0',textAlign:'center'}}>
                <span className="serif" style={{fontSize:14,color:rows.length>1?'var(--faint)':'transparent'}}>✕</span>
              </Pressable>
            </div>
            );
          })}
        </section>
        <section style={{padding:'12px 24px 0'}}>
          <Pressable onClick={addRow} style={{display:'flex',alignItems:'center',gap:10,padding:'14px 0'}}>
            <span className="serif" style={{fontSize:18,color:'var(--terra-ink)'}}>+</span>
            <span className="serif" style={{fontSize:15,color:'var(--terra-ink)',fontStyle:'italic'}}>add row</span>
          </Pressable>
        </section>
        <section style={{padding:'24px 24px 36px'}}>
          <ButtonSerif primary onClick={saveBulk} style={{width:'100%'}}>
            Save {filledCount>0?`${filledCount} `:''}entries
          </ButtonSerif>
          <div style={{marginTop:24,paddingTop:22,borderTop:'1px solid var(--rule-soft)'}}>
            <p className="serif" style={{fontSize:14,color:'var(--muted)',fontStyle:'italic',lineHeight:1.55,textWrap:'pretty'}}>"Put down every name. If a name comes to mind, put it down."</p>
            <Stamp style={{marginTop:8,display:'block'}}>Big Book, pg 65</Stamp>
          </div>
        </section>
      </ScreenBody>
    </>
  );
}

        <section style={{padding:'12px 24px 0'}}>

        <section style={{padding:'32px 24px 0'}}>
          <Eyebrow style={{marginBottom:16}}>Affects my…</Eyebrow>

/** Serif column wheel picker. value is a string, options is an array of strings. */
function WheelColumn({value, options, onChange, width=66, fontSize=22}){
  const ref = useRef(null);
  const ROW_H = 40;
  // Scroll so selected sits in middle
  useEffect(()=>{
    if(!ref.current) return;
    const i = options.indexOf(value);
    if(i<0) return;
    ref.current.scrollTop = i*ROW_H;
  },[value, options]);
  const onScroll = ()=>{
    if(!ref.current) return;
    clearTimeout(ref.current._t);
    ref.current._t = setTimeout(()=>{
      const i = Math.round(ref.current.scrollTop / ROW_H);
      const clamped = Math.max(0, Math.min(options.length-1, i));
      const v = options[clamped];
      if(v !== value) onChange(v);
      ref.current.scrollTop = clamped*ROW_H;
    }, 110);
  };
  return (
    <div style={{position:'relative', width, height:ROW_H*3,
      background:'var(--surface)', border:'1px solid var(--rule)', borderRadius:8,
      overflow:'hidden'}}>
      {/* Top + bottom fade */}
      <div style={{position:'absolute',top:0,left:0,right:0,height:ROW_H,
        background:'linear-gradient(to bottom, var(--surface), transparent)',
        pointerEvents:'none',zIndex:2}}/>
      <div style={{position:'absolute',bottom:0,left:0,right:0,height:ROW_H,
        background:'linear-gradient(to top, var(--surface), transparent)',
        pointerEvents:'none',zIndex:2}}/>
      {/* Center highlight bars */}
      <div style={{position:'absolute',top:ROW_H,left:6,right:6,height:1,
        background:'var(--rule)',zIndex:1,pointerEvents:'none'}}/>
      <div style={{position:'absolute',top:ROW_H*2,left:6,right:6,height:1,
        background:'var(--rule)',zIndex:1,pointerEvents:'none'}}/>
      <div ref={ref} onScroll={onScroll}
        style={{height:'100%',overflowY:'scroll',scrollSnapType:'y mandatory',
          WebkitOverflowScrolling:'touch'}}>
        <div style={{height:ROW_H}}/>
        {options.map(opt=>(
          <div key={opt}
            onClick={()=>onChange(opt)}
            style={{height:ROW_H, display:'flex', alignItems:'center', justifyContent:'center',
              scrollSnapAlign:'center', cursor:'pointer',
              fontFamily:'Newsreader,Georgia,serif',
              fontSize, fontVariantNumeric:'oldstyle-nums',
              color: opt===value ? 'var(--ink)' : 'var(--muted)',
              fontWeight:opt===value?400:300}}>
            {opt}
          </div>
        ))}
        <div style={{height:ROW_H}}/>
      </div>
    </div>
  );
}

function SerifTimePicker({hour, minute, ampm, onChange}){
  const hours = Array.from({length:12}, (_,i)=>String(i+1));
  const minutes = Array.from({length:12}, (_,i)=>String(i*5).padStart(2,'0'));
  const ampms = ['AM','PM'];
  const setH = (v)=>onChange({hour:parseInt(v,10), minute, ampm});
  const setM = (v)=>onChange({hour, minute:parseInt(v,10), ampm});
  const setA = (v)=>onChange({hour, minute, ampm:v});
  return (
    <div style={{display:'flex',gap:10,alignItems:'center',justifyContent:'flex-start'}}>
      <WheelColumn value={String(hour||7)} options={hours} onChange={setH}/>
      <span className="serif" style={{fontSize:24,color:'var(--muted)'}}>:</span>
      <WheelColumn value={String(minute||0).padStart(2,'0')} options={minutes} onChange={setM}/>
      <WheelColumn value={ampm||'AM'} options={ampms} onChange={setA} width={62}/>
    </div>
  );
}

/** Shared contact form, used by Add and Edit. */
function ContactForm({initial, onSave, onDelete}){
  const nav=useNav();
  const {sponsor}=useContacts();
  const [name,setName]=useState(initial.name||'');
  const [role,setRole]=useState(initial.role||'Fellowship');
  const [phone,setPhone]=useState(initial.phone||'');
  const [email,setEmail]=useState(initial.email||'');
  const [tagLine,setTagLine]=useState(initial.tagLine||'');
  const [howWeMet,setHowWeMet]=useState(initial.howWeMet||'');

  const trySave=()=>{
    if(!name.trim()){ alert('Please add a name or initials before saving.'); return; }
    // Single-sponsor rule
    if(role==='Sponsor' && sponsor && sponsor.id!==initial.id){
      const ok = confirm(`Replace ${sponsor.name} as your sponsor? They will move to Fellowship.`);
      if(!ok) return;
    }
    onSave({name:name.trim(), role, phone:phone.trim(), email:email.trim(), tagLine:tagLine.trim(), howWeMet:howWeMet.trim()});
    nav.back();
  };

  return (
    <ScreenBody>
      <section style={{padding:'12px 24px 0'}}>
        <Eyebrow style={{marginBottom:4}}>Name or initials</Eyebrow>
        <SerifInput value={name} onChange={setName} autoFocus placeholder="e.g. Marcus, Anne L., R.B."/>
        <div style={{marginTop:28}}>
          <Eyebrow style={{marginBottom:12}}>Role</Eyebrow>
          <SegPills value={role} onChange={setRole} options={[
            {value:'Fellowship',label:'Fellowship'},
            {value:'Sponsor',label:'Sponsor'},
            {value:'Sponsee',label:'Sponsee'},
          ]}/>
          {role==='Sponsor' && sponsor && sponsor.id!==initial.id && (
            <p className="serif" style={{fontSize:13,color:'var(--terra-ink)',fontStyle:'italic',marginTop:8,lineHeight:1.5}}>
              You already have a sponsor: {sponsor.name}. Saving as Sponsor will move {sponsor.name} to Fellowship.
            </p>
          )}
        </div>
        <div style={{marginTop:28}}>
          <Eyebrow style={{marginBottom:4}}>Tag line · optional</Eyebrow>
          <SerifInput value={tagLine} onChange={setTagLine} placeholder="e.g. Tuesday Big Book crew, old-timer"/>
          <p className="serif" style={{fontSize:13,color:'var(--muted)',fontStyle:'italic',marginTop:6,lineHeight:1.5}}>
            A short descriptor shown under the name in lists and the detail header.
          </p>
        </div>
        <div style={{marginTop:28}}>
          <Eyebrow style={{marginBottom:4}}>Phone · private</Eyebrow>
          <SerifInput value={phone} onChange={setPhone} placeholder="(415) 555-…"/>
        </div>
        <div style={{marginTop:28}}>
          <Eyebrow style={{marginBottom:4}}>Email · private</Eyebrow>
          <SerifInput value={email} onChange={setEmail} placeholder="name@example.com"/>
        </div>
        <div style={{marginTop:28}}>
          <Eyebrow style={{marginBottom:4}}>How we met · optional</Eyebrow>
          <SerifTextarea value={howWeMet} onChange={setHowWeMet} minRows={2} placeholder="Meeting, mutual friend…"/>
        </div>
        <div style={{marginTop:28}}>
          <NoteBox>All contact details stay on this device only and are never shared or synced.</NoteBox>
        </div>
        <div style={{marginTop:24,paddingBottom:36}}>
          <ButtonSerif primary onClick={trySave} style={{width:'100%'}}>Save</ButtonSerif>
          {onDelete && (
            <Pressable onClick={()=>{ if(confirm(`Remove ${initial.name} from your contacts?`)){ onDelete(); nav.back(); } }} style={{padding:'18px 0',marginTop:8,textAlign:'center',width:'100%'}}>
              <span className="serif" style={{fontSize:15,color:'#a04030',fontStyle:'italic'}}>Remove this contact</span>
            </Pressable>
          )}
        </div>
      </section>
    </ScreenBody>
  );
}

/** Compact time-picker row used inside the Reminders editor. */
function MiniTimePicker({hour, minute, ampm, onChange}){
  const hours=Array.from({length:12},(_,i)=>String(i+1));
  const mins=Array.from({length:12},(_,i)=>String(i*5).padStart(2,'0'));
  const ampms=['AM','PM'];
  const setH=(v)=>onChange({hour:parseInt(v,10), minute, ampm});
  const setM=(v)=>onChange({hour, minute:parseInt(v,10), ampm});
  const setA=(v)=>onChange({hour, minute, ampm:v});
  const sel = (val, opts, on) => (
    <select value={String(val)} onChange={(e)=>on(e.target.value)}
      style={{padding:'6px 8px',background:'transparent',border:'1px solid var(--rule)',borderRadius:6,fontFamily:'Newsreader,Georgia,serif',fontSize:15,color:'var(--ink)',outline:'none',fontVariantNumeric:'oldstyle-nums'}}>
      {opts.map(o=><option key={o} value={o}>{o}</option>)}
    </select>
  );
  return (
    <div style={{display:'flex',gap:6,alignItems:'center'}}>
      {sel(hour||7, hours, setH)}
      <span className="serif" style={{color:'var(--muted)'}}>:</span>
      {sel(String(minute||0).padStart(2,'0'), mins, setM)}
      {sel(ampm||'AM', ampms, setA)}
    </div>
  );
}

function ExportScreen(){
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState('');
  const [history, setHistory] = useState(loadBackupHistory);
  const fileInputRef = useRef(null);

  const download = async ()=>{
    const pin = prompt('Enter your PIN to encrypt the backup file:');
    if(!pin) return;
    setBusy(true); setMsg('');
    try{
      // Verify PIN is the right one before encrypting
      const stored = loadPin();
      if(!stored){ throw new Error('No PIN is set. Set a PIN first in More → Security.'); }
      const hash = await sha256(stored.salt + pin);
      if(hash !== stored.hash){ throw new Error("That PIN doesn't match. Please try again."); }

      const blob = await encryptBackup(pin);
      const json = JSON.stringify(blob, null, 2);
      const bytes = new Blob([json], {type:'application/json'});
      const ts = new Date();
      const stamp = `${ts.getFullYear()}${String(ts.getMonth()+1).padStart(2,'0')}${String(ts.getDate()).padStart(2,'0')}-${String(ts.getHours()).padStart(2,'0')}${String(ts.getMinutes()).padStart(2,'0')}`;
      const filename = `stepwork-backup-${stamp}.swbak.json`;
      const url = URL.createObjectURL(bytes);
      const a = document.createElement('a');
      a.href = url; a.download = filename; a.click();
      URL.revokeObjectURL(url);
      recordBackup(filename, bytes.size);
      setHistory(loadBackupHistory());
      setMsg(`Saved ${filename} (${(bytes.size/1024).toFixed(1)} KB).`);
    }catch(e){ setMsg(e.message||'Backup failed.'); }
    setBusy(false);
  };

  const importFile = ()=>{
    if(fileInputRef.current) fileInputRef.current.click();
  };

  const handleFile = async (e)=>{
    const file = e.target.files && e.target.files[0];
    if(!file) return;
    const pin = prompt('Enter the PIN that was active when this backup was created:');
    if(!pin){ e.target.value=''; return; }
    setBusy(true); setMsg('');
    try{
      const text = await file.text();
      const blob = JSON.parse(text);
      const data = await decryptBackup(blob, pin);
      if(!confirm('Replace ALL current data on this device with the backup? This cannot be undone.')){ setBusy(false); e.target.value=''; return; }
      // Restore
      BACKUP_STORE_KEYS.forEach(k=>{
        if(data[k] !== undefined) localStorage.setItem(k, data[k]);
        else localStorage.removeItem(k);
      });
      setMsg('Restore complete. Refresh the app to see your data.');
    }catch(err){ setMsg(err.message||'Import failed.'); }
    e.target.value='';
    setBusy(false);
  };

  const clearAll = ()=>{
    if(!confirm('Permanently erase ALL data on this device? Your inventory, contacts, meetings, and journal will be gone. This cannot be undone.')) return;
    if(!confirm('Last chance. Really erase everything?')) return;
    BACKUP_STORE_KEYS.forEach(k=>localStorage.removeItem(k));
    localStorage.removeItem(BACKUP_HISTORY_KEY);
    localStorage.removeItem(PIN_KEY);
    setMsg('All data cleared. Refresh the app to start over.');
  };

  return (
    <>
      <AppBar eyebrow="Settings" title="Export & backup"/>
      <ScreenBody>
        <section style={{padding:'12px 24px 0'}}>
          <NoteBox>Backups are encrypted with your PIN. Without the PIN, the file cannot be opened — keep both safe. Save the file to a cloud folder (iCloud / Drive / Dropbox) to move between devices.</NoteBox>
        </section>
        <section style={{padding:'24px 24px 0'}}>
          <ButtonSerif primary onClick={download} style={{width:'100%'}}>{busy?'Working…':'Download encrypted backup'}</ButtonSerif>
          <ButtonSerif onClick={importFile} style={{width:'100%',marginTop:12}}>Import from backup file…</ButtonSerif>
          <input ref={fileInputRef} type="file" accept=".json,.swbak,.swbak.json,application/json" onChange={handleFile} style={{display:'none'}}/>
          {msg && <p className="serif" style={{fontSize:14,color:msg.includes('failed')||msg.includes('match')||msg.includes('Not')?'#a04030':'var(--terra-ink)',fontStyle:'italic',marginTop:14,lineHeight:1.5,textWrap:'pretty'}}>{msg}</p>}
        </section>
        <Hairline style={{margin:'28px 24px 0'}}/>
        <section style={{padding:'22px 24px 0'}}>
          <Eyebrow style={{marginBottom:14}}>Recent backups · this device</Eyebrow>
          {history.length===0 && (
            <p className="serif" style={{fontSize:14,color:'var(--muted)',fontStyle:'italic',padding:'8px 0'}}>No backups yet.</p>
          )}
          {history.map((b,i)=>{
            const d = new Date(b.when);
            const when = d.toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
            const sz = b.bytes < 1024 ? `${b.bytes} B` : `${(b.bytes/1024).toFixed(1)} KB`;
            return (
              <div key={i} style={{display:'flex',alignItems:'baseline',gap:14,padding:'12px 0',borderBottom:i<history.length-1?'1px solid var(--rule-soft)':'none'}}>
                <div className="serif" style={{flex:1,fontSize:15,lineHeight:1.3}}>{b.name}</div>
                <Stamp>{when} · {sz}</Stamp>
              </div>
            );
          })}
        </section>
        <section style={{padding:'32px 24px 28px'}}>
          <Pressable onClick={clearAll} style={{padding:'12px 0'}}>
            <span className="serif" style={{fontSize:15,color:'#a04030',fontStyle:'italic'}}>Clear all data on this device</span>
          </Pressable>
        </section>
      </ScreenBody>
    </>
  );
}

            <input type="date" value={sobrietyDate} onChange={(e)=>setSobrietyDate(e.target.value)}

            {sobrietyDate&&previewDays>0&&(
              <Stamp style={{marginTop:6,display:'block',color:'var(--terra-ink)'}}>
                day {previewDays}
              </Stamp>
            )}
          </div>
          <div style={{marginTop:28}}>
            <Eyebrow style={{marginBottom:4}}>Home group · optional</Eyebrow>
            <SerifInput value={homeGroup} onChange={setHomeGroup} placeholder="e.g. Tuesday Big Book"/>

        </section>
        <section style={{padding:'32px 24px 40px'}}>
          <ButtonSerif primary onClick={save} style={{width:'100%'}}>Save profile</ButtonSerif>
        </section>
      </ScreenBody>
    </>
  );
}

function SecurityScreen(){
  const nav=useNav();
  const stored = loadPin();
  const hasQ = !!(stored && stored.question);
  const reset = ()=>{
    if(confirm('Reset the PIN? You will be asked to set a new one the next time the app opens.')){
      localStorage.removeItem(PIN_KEY);
      alert('PIN cleared. Refresh the app to set a new one.');
    }
  };
  return (
    <>
      <AppBar eyebrow="More" title="Security"/>
      <ScreenBody>
        <section style={{padding:'12px 24px 0'}}>
          <NoteBox>Your PIN unlocks this app on this device. It is stored as a one-way hash — even we can't see it.</NoteBox>
        </section>
        <section style={{padding:'24px 24px 0'}}>
          <Eyebrow style={{marginBottom:8}}>PIN</Eyebrow>
          <div className="serif" style={{fontSize:17}}>{stored?'Set · asks on every open':'Not set'}</div>
          <Stamp style={{marginTop:4,display:'block'}}>Reset the PIN to choose a new one.</Stamp>
          <ButtonSerif onClick={reset} style={{marginTop:14}}>Reset PIN</ButtonSerif>
        </section>
        <Hairline style={{margin:'28px 24px 0'}}/>
        <section style={{padding:'24px 24px 40px'}}>
          <Eyebrow style={{marginBottom:8}}>Recovery question</Eyebrow>
          <div className="serif" style={{fontSize:17}}>{hasQ?'Set':'Not set'}</div>
          <Stamp style={{marginTop:4,display:'block'}}>{hasQ?'Used if you forget your PIN.':'Without one, a forgotten PIN means starting over.'}</Stamp>
        </section>
      </ScreenBody>
    </>
  );
}

function PracticeScreen(){
  const {practice, setPractice} = usePractice();
  const hour = practice.prayerResetHour;
  const minute = practice.prayerResetMinute;
  const ampm = hour>=12?'PM':'AM';
  const hour12 = hour===0?12:hour>12?hour-12:hour;

  const setTime = ({hour:h, minute:m, ampm:a}) => {
    // convert back to 24h
    let h24 = parseInt(h,10);
    if(a==='PM' && h24<12) h24+=12;
    if(a==='AM' && h24===12) h24=0;
    setPractice({ prayerResetHour:h24, prayerResetMinute:parseInt(m,10) });
  };
  return (
    <>
      <AppBar eyebrow="More" title="Daily practice"/>
      <ScreenBody>
        <section style={{padding:'12px 24px 0'}}>
          <NoteBox>Pick when each day rolls over for the morning prayers. Many programs use an early-morning reset like 4:00 AM so prayers belong to "today" even if you woke at 3 AM.</NoteBox>
        </section>
        <section style={{padding:'24px 24px 0'}}>
          <Eyebrow style={{marginBottom:14}}>Prayer reset time</Eyebrow>
          <SerifTimePicker hour={hour12} minute={minute} ampm={ampm} onChange={setTime}/>
          <Stamp style={{marginTop:10,display:'block'}}>The day flips at this time. Default 4:00 AM.</Stamp>
        </section>
        <Hairline style={{margin:'32px 24px 0'}}/>
        <section style={{padding:'24px 24px 0'}}>
          <Eyebrow style={{marginBottom:14}}>Show on Today screen</Eyebrow>
          <Pressable onClick={()=>setPractice({showMorning:!practice.showMorning})} style={{display:'flex',alignItems:'center',gap:14,padding:'14px 0',borderBottom:'1px solid var(--rule-soft)'}}>
            <div style={{flex:1}}>
              <div className="serif" style={{fontSize:17,color:practice.showMorning?'var(--ink)':'var(--muted)'}}>Morning prayers</div>
              <Stamp style={{marginTop:2,display:'block'}}>The intention + 17 short prayers</Stamp>
            </div>
            <SwitchInk on={practice.showMorning} onToggle={()=>setPractice({showMorning:!practice.showMorning})}/>
          </Pressable>
          <Pressable onClick={()=>setPractice({showEvening:!practice.showEvening})} style={{display:'flex',alignItems:'center',gap:14,padding:'14px 0'}}>
            <div style={{flex:1}}>
              <div className="serif" style={{fontSize:17,color:practice.showEvening?'var(--ink)':'var(--muted)'}}>Evening review</div>
              <Stamp style={{marginTop:2,display:'block'}}>The constructive review + notes</Stamp>
            </div>
            <SwitchInk on={practice.showEvening} onToggle={()=>setPractice({showEvening:!practice.showEvening})}/>
          </Pressable>
        </section>
        <section style={{padding:'24px 24px 40px'}}>
          <p className="serif" style={{fontSize:13,color:'var(--muted)',fontStyle:'italic',lineHeight:1.5,textWrap:'pretty',margin:0}}>Hiding a section also hides its row from the Today screen. Your saved entries stay safe in the journal either way.</p>
        </section>
      </ScreenBody>
    </>
  );
}

<!-- PWA · register the service worker so the app is installable + works offline -->
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js')
      .then((reg) => {
        // If a new version is waiting, ask it to take over immediately on next page load.
        if (reg.waiting) reg.waiting.postMessage('skipWaiting');
        reg.addEventListener('updatefound', () => {
          const nw = reg.installing;
          if (!nw) return;
          nw.addEventListener('statechange', () => {
            if (nw.state === 'installed' && navigator.serviceWorker.controller) {
              nw.postMessage('skipWaiting');
            }
          });
        });
      })
      .catch((err) => console.warn('SW registration failed:', err));
  });
}
</script>
