/** Shared meeting form. Used by Add and Edit. */
function MeetingForm({initial, onSave, onDelete, title='Add a meeting'}){
  const nav=useNav();
  const [name,setName]=useState(initial.name||'');
  const [kind,setKind]=useState(initial.kind||'zoom');
  const [hour,setHour]=useState(initial.hour||7);
  const [minute,setMinute]=useState(initial.minute||0);
  const [ampm,setAmpm]=useState(initial.ampm||'PM');
  const [weekdays,setWeekdays]=useState(initial.weekdays||[]);
  const [duration,setDuration]=useState(String(initial.duration||60));
  const [meetingId,setMeetingId]=useState(initial.meetingId||'');
  const [passcode,setPasscode]=useState(initial.passcode||'');
  const [address,setAddress]=useState(initial.address||'');
  const [host,setHost]=useState(initial.host||'');
  const [notes,setNotes]=useState(initial.notes||'');

  const toggleDay=(idx)=>setWeekdays(prev=>{
    if(prev.includes(idx)) return prev.filter(d=>d!==idx);
    return [...prev, idx].sort();
  });

  const previewUrl=(kind==='zoom'||kind==='hybrid')?buildZoomUrl(meetingId,passcode):'';

  const trySave=()=>{
    if(!name.trim()){ alert('Please name the meeting before saving.'); return; }
    if(weekdays.length===0){ alert('Pick at least one day of the week.'); return; }
    const patch={
      name:name.trim(),
      kind,
      hour, minute, ampm,
      weekdays,
      duration: parseInt(duration,10)||60,
      meetingId: meetingId.trim(),
      passcode: passcode.trim(),
      url: previewUrl,
      address: address.trim(),
      host: host.trim(),
      notes: notes.trim(),
    };
    onSave(patch);
    nav.back();
  };

  const isZoom=kind==='zoom'||kind==='hybrid';
  const isInPerson=kind==='in-person'||kind==='hybrid';

  return (
    <>
      <AppBar eyebrow="Meeting" title={title} right={<ButtonText onClick={trySave}>save →</ButtonText>}/>
      <ScreenBody>
        <section style={{padding:'12px 24px 0'}}>
          <Eyebrow style={{marginBottom:4}}>Meeting name</Eyebrow>
          <SerifInput value={name} onChange={setName} autoFocus placeholder="e.g. Tuesday Big Book"/>

          <div style={{marginTop:28}}>
            <Eyebrow style={{marginBottom:12}}>Format</Eyebrow>
            <SegPills value={kind} onChange={setKind} options={[
              {value:'zoom',label:'Zoom'},
              {value:'in-person',label:'In person'},
              {value:'hybrid',label:'Hybrid'},
            ]}/>
          </div>

          <div style={{marginTop:28}}>
            <Eyebrow style={{marginBottom:8}}>Time · device-local</Eyebrow>
            <SerifTimePicker hour={hour} minute={minute} ampm={ampm}
              onChange={({hour:h, minute:m, ampm:a})=>{ setHour(h); setMinute(m); setAmpm(a); }}/>
            <p className="serif" style={{fontSize:13,color:'var(--muted)',fontStyle:'italic',marginTop:8,lineHeight:1.5}}>
              Drag a column to choose · {fmt12h(hour,minute,ampm)}
            </p>
          </div>

          <div style={{marginTop:28}}>
            <Eyebrow style={{marginBottom:12}}>Repeats weekly on</Eyebrow>
            <WeekdayChips selected={weekdays} onToggle={toggleDay}/>
            <p className="serif" style={{fontSize:13,color:'var(--muted)',fontStyle:'italic',marginTop:8,lineHeight:1.5}}>
              {weekdays.length===0?'Pick one or more days.':`Selected · ${weekdayBadge(weekdays)}`}
            </p>
          </div>

          <div style={{marginTop:28}}>
            <Eyebrow style={{marginBottom:4}}>Duration · minutes</Eyebrow>
            <SerifInput value={duration} onChange={setDuration} placeholder="60"/>
          </div>

          {isZoom && (
            <>
              <div style={{marginTop:28}}>
                <Eyebrow style={{marginBottom:4}}>Zoom meeting ID</Eyebrow>
                <SerifInput value={meetingId} onChange={setMeetingId} placeholder="e.g. 867 530 9"/>
              </div>
              <div style={{marginTop:28}}>
                <Eyebrow style={{marginBottom:4}}>Passcode</Eyebrow>
                <SerifInput value={passcode} onChange={setPasscode} placeholder="e.g. serenity"/>
                {previewUrl && (
                  <p className="serif" style={{fontSize:13,color:'var(--terra-ink)',marginTop:8,wordBreak:'break-all',fontStyle:'italic'}}>
                    Link → {previewUrl}
                  </p>
                )}
              </div>
            </>
          )}

          {isInPerson && (
            <div style={{marginTop:28}}>
              <Eyebrow style={{marginBottom:4}}>Address</Eyebrow>
              <SerifInput value={address} onChange={setAddress} placeholder="123 Main St, City"/>
            </div>
          )}

          <div style={{marginTop:28}}>
            <Eyebrow style={{marginBottom:4}}>Host / intergroup · optional</Eyebrow>
            <SerifInput value={host} onChange={setHost} placeholder="e.g. Tuesday Big Book group"/>
          </div>

          <div style={{marginTop:28}}>
            <Eyebrow style={{marginBottom:4}}>Notes · optional</Eyebrow>
            <SerifTextarea value={notes} onChange={setNotes} minRows={2} placeholder="Open sharing, speaker, BB study…"/>
          </div>

          <div style={{marginTop:28}}>
            <NoteBox>Meeting details stay on this device and are never shared.</NoteBox>
          </div>

          <div style={{marginTop:24,paddingBottom:36}}>
            <ButtonSerif primary onClick={trySave} style={{width:'100%'}}>Save meeting</ButtonSerif>
            {onDelete && (
              <Pressable onClick={()=>{ if(confirm(`Remove "${initial.name}" from your meetings?`)){ onDelete(); nav.back(); } }} style={{padding:'18px 0',marginTop:8,textAlign:'center',width:'100%'}}>
                <span className="serif" style={{fontSize:15,color:'#a04030',fontStyle:'italic'}}>Remove this meeting</span>
              </Pressable>
            )}
          </div>
        </section>
      </ScreenBody>
    </>
  );
}

/* ── F6 SPONSOR IMPORT + REVIEW ─────────────────────────────────────
   Sponsor loads an encrypted box + key, it's filed under the matching
   sponsee contact, then read with per-section comments and sent back. */

function pickFileText(){
  return new Promise((resolve)=>{
    const inp=document.createElement('input');
    inp.type='file'; inp.accept='.swshare,.json,.swbak,application/json';
    let settled=false;
    const finish=(v)=>{ if(!settled){ settled=true; resolve(v); } };
    inp.onchange=()=>{ const f=inp.files&&inp.files[0]; if(!f){finish(null);return;}
      const fr=new FileReader(); fr.onload=()=>finish(fr.result); fr.onerror=()=>finish(null); fr.readAsText(f); };
    inp.addEventListener('cancel', ()=>finish(null)); // fired by modern browsers when the dialog is dismissed
    inp.click();
  });
}

/* A friendly, human label for a section id. */
function sectionLabel(id){
  const s=SHARE_STEP_SECTIONS.find(x=>x.id===id); return s?s.label:id;
}

/* ── Sponsor-view rendering of shared work (F6.2) ──
   Internal record ids (id, causeId, resentmentId, …) are never shown.
   Answers are rendered under their actual question text (reusing the same
   question constants the worksheets use) so the sponsor reads in context. */
/* ── Sponsor-view derivations (no share-format change; all client-side) ── */
/* Sections whose rows carry a person's `name` and can be grouped by person. */
const PERSON_SECTIONS = ['resentments','causes','faults','fears','sexRelations','amends'];

/* Count summary for one section's payload value. Returns {n, detail}. */
function shareSectionStats(secId, val){
  if(val==null) return {n:0, detail:''};
  if(Array.isArray(val)){
    const n=val.length;
    if(secId==='causes'){
      const names=new Set(val.map(r=>r&&r.name).filter(Boolean));
      return {n, detail:`across ${names.size} name${names.size===1?'':'s'}`};
    }
    if(secId==='amends'){
      const made=val.filter(r=>r&&r.complete).length;
      const living=val.filter(r=>r&&r.living&&!r.complete).length;
      const bits=[]; if(made) bits.push(`${made} made`); if(living) bits.push(`${living} living`);
      return {n, detail:bits.join(' · ')};
    }
    return {n, detail:''};
  }
  if(typeof val==='object'){
    const keys=Object.keys(val);
    return {n:keys.length, detail:''};
  }
  return {n:0, detail:''};
}

/* How many causes & effects rows hang off a given name (used for the badge). */
function causeCountForName(causes, name){
  if(!Array.isArray(causes)) return 0;
  return causes.filter(c=>c && c.name===name).length;
}

/* Build a person-keyed index from a review payload.
   → [{ name, sections: { secId: [rows] }, causeCount }] sorted by causeCount desc. */
function groupReviewByPerson(payload, stepIds){
  const map=new Map();
  (stepIds||[]).forEach(secId=>{
    if(!PERSON_SECTIONS.includes(secId)) return;
    const val=payload&&payload[secId];
    if(!Array.isArray(val)) return;
    val.forEach(row=>{
      const nm=(row&&typeof row.name==='string'&&row.name.trim())?row.name.trim():'(unnamed)';
      if(!map.has(nm)) map.set(nm,{name:nm, sections:{}});
      const e=map.get(nm);
      (e.sections[secId]=e.sections[secId]||[]).push(row);
    });
  });
  const out=[...map.values()].map(e=>({
    ...e,
    causeCount:(e.sections.causes||[]).length,
    total:Object.values(e.sections).reduce((a,b)=>a+b.length,0),
  }));
  out.sort((a,b)=> b.causeCount-a.causeCount || b.total-a.total || a.name.localeCompare(b.name));
  return out;
}

/* Small count badge (e.g. number of causes on a name). */
function CountBadge({n, label}){
  if(!n) return null;
  return (
    <span className="serif" title={label?`${n} ${label}`:undefined}
      style={{display:'inline-flex',alignItems:'center',justifyContent:'center',minWidth:22,height:22,padding:'0 7px',
        borderRadius:11,background:'var(--terra-soft)',color:'var(--terra-ink)',fontSize:12,fontVariantNumeric:'tabular-nums',
        border:'1px solid var(--rule)',lineHeight:1}}>{n}</span>
  );
}

const SHARE_QUESTION_SETS = {
  faults: FAULTS_GROUPS.flatMap(g=>g.questions),
  fear2: FEAR2_QUESTIONS,
  sexRelations: SEX_QUESTIONS,
};
const SHARE_FIELD_LABELS = {
  cause:'The cause', harms:'The harm done', direct:'Direct amends',
  type:'Type', category:'Category', categories:'Fear categories',
  withLife:'Life with this defect', withoutVision:'Life without it', prayer:'Prayer',
};
const SHARE_SKIP_KEY = (k)=> k==='id' || /Id$/.test(k);

/* One record (one resentment, one amends row, …) as labeled question/answer rows. */
/* Tap-to-add note on a single record. `noteFor(id)` returns the saved note (or '');
   `onNote(id,val)` saves it. When `readOnly`, shows the note but no editor (sponsee side). */
function RecordNote({recId, noteFor, onNote, readOnly, who}){
  if(!recId || (!onNote && !noteFor)) return null;
  const existing = noteFor ? (noteFor(recId)||'') : '';
  const [openEd,setOpenEd]=useState(false);
  if(readOnly){
    if(!existing.trim()) return null;
    return (
      <div style={{marginTop:8,padding:'10px 14px',borderLeft:'3px solid var(--terra)',background:'var(--terra-soft)',borderRadius:'0 8px 8px 0'}}>
        <Stamp style={{color:'var(--terra-ink)'}}>{who||"Sponsor's"} note</Stamp>
        <p className="serif" style={{fontSize:15,color:'var(--ink)',lineHeight:1.5,margin:'3px 0 0',textWrap:'pretty'}}>{existing}</p>
      </div>
    );
  }
  if(!openEd && !existing.trim()){
    return (
      <Pressable onClick={()=>setOpenEd(true)} style={{marginTop:6,padding:'2px 0'}}>
        <span className="serif" style={{fontSize:13,fontStyle:'italic',color:'var(--terra-ink)'}}>+ add note</span>
      </Pressable>
    );
  }
  return (
    <div style={{marginTop:8}}>
      <Stamp style={{color:'var(--terra-ink)',marginBottom:4,display:'block'}}>Your note on this</Stamp>
      <SerifTextarea value={existing} onChange={(v)=>onNote(recId,v)} minRows={2} placeholder="Note for this item…" autoFocus={openEd&&!existing}/>
    </div>
  );
}

function ShareRecord({secId, rec, noteFor, onNote, readOnly}){
  const qs = SHARE_QUESTION_SETS[secId]||[];
  const qKeys = new Set(qs.map(q=>q.key));
  const rows=[];
  qs.forEach(q=>{ const v=rec[q.key]; if(typeof v==='string'&&v.trim()) rows.push({label:q.q, val:v}); });
  Object.entries(rec).forEach(([k,v])=>{
    if(SHARE_SKIP_KEY(k)||k==='name'||qKeys.has(k)) return;
    if(Array.isArray(v)&&v.length&&v.every(x=>typeof x==='string')) rows.push({label:SHARE_FIELD_LABELS[k]||k, val:v.join(' · ')});
    else if(typeof v==='string'&&v.trim()) rows.push({label:SHARE_FIELD_LABELS[k]||null, val:v});
  });
  const status = secId==='amends' ? (rec.complete?'amends made ✓':(rec.living?'living amends':null)) : null;
  const title = (typeof rec.name==='string'&&rec.name.trim()) ? rec.name : null;
  const recId = rec && rec.id ? ('item:'+rec.id) : null;
  return (
    <div style={{padding:'12px 0',borderBottom:'1px solid var(--rule-soft)'}}>
      {title&&(
        <div style={{display:'flex',alignItems:'baseline',gap:10}}>
          <div className="serif" style={{fontSize:17,color:'var(--ink)',flex:1,minWidth:0}}>{title}</div>
          {status&&<Stamp style={{color:'var(--terra-ink)'}}>{status}</Stamp>}
        </div>
      )}
      {rows.length===0 && !title && <p className="serif" style={{fontSize:15,color:'var(--muted)',fontStyle:'italic',margin:0}}>—</p>}
      {rows.map((r,i)=>(
        <div key={i} style={{marginTop:i===0&&!title?0:8}}>
          {r.label&&<Stamp>{r.label}</Stamp>}
          <p className="serif" style={{fontSize:16,color:'var(--ink)',lineHeight:1.5,margin:'2px 0 0',textWrap:'pretty'}}>{r.val}</p>
        </div>
      ))}
      <RecordNote recId={recId} noteFor={noteFor} onNote={onNote} readOnly={readOnly}/>
    </div>
  );
}

function ReviewSectionBlock({secId, data, comment, onComment, collapsible=true, startOpen=false, noteFor, onNote, readOnly}){
  const [open,setOpen]=useState(startOpen);
  const rows=[];
  if(Array.isArray(data)){
    data.forEach((rec,i)=>rows.push(<ShareRecord key={i} secId={secId} rec={rec} noteFor={noteFor} onNote={onNote} readOnly={readOnly}/>));
  }else if(data&&typeof data==='object'){
    // fear2: { categoryName: {q1..q9} } — one block per category, questions repeated.
    Object.entries(data).forEach(([cat,answers])=>{
      const inner=[];
      if(answers&&typeof answers==='object'){
        FEAR2_QUESTIONS.forEach(q=>{
          const v=answers[q.key];
          if(typeof v==='string'&&v.trim()) inner.push(
            <div key={q.key} style={{marginTop:8}}>
              <Stamp>{q.q}</Stamp>
              <p className="serif" style={{fontSize:16,color:'var(--ink)',lineHeight:1.5,margin:'2px 0 0',textWrap:'pretty'}}>{v}</p>
            </div>
          );
        });
      }
      rows.push(
        <div key={cat} style={{padding:'12px 0',borderBottom:'1px solid var(--rule-soft)'}}>
          <div className="serif" style={{fontSize:17,color:'var(--ink)'}}>{cat}</div>
          {inner.length?inner:<p className="serif" style={{fontSize:15,color:'var(--muted)',fontStyle:'italic',margin:'4px 0 0'}}>No answers yet.</p>}
        </div>
      );
    });
  }
  const stats=shareSectionStats(secId, data);
  const body=(
    <>
      {rows.length?rows:<p className="serif" style={{fontSize:15,color:'var(--muted)',fontStyle:'italic'}}>No entries.</p>}
      <div style={{marginTop:12}}>
        <Eyebrow style={{marginBottom:6}}>Your note on this section</Eyebrow>
        <SerifTextarea value={comment||''} onChange={onComment} minRows={2} placeholder="Feedback for this section…"/>
      </div>
    </>
  );

    return (
      <section style={{padding:'22px 24px 0'}}>
        <h3 className="serif" style={{fontSize:20,fontWeight:400,marginBottom:8}}>{sectionLabel(secId)}</h3>
        {body}
      </section>
    );
  }
  return (
    <section style={{padding:'14px 24px 0'}}>
      <Pressable onClick={()=>setOpen(o=>!o)} style={{display:'flex',alignItems:'center',gap:12,width:'100%',padding:'12px 14px',border:'1px solid var(--rule)',borderRadius:10,background:open?'var(--paper-deep)':'transparent',textAlign:'left'}}>
        <div style={{flex:1,minWidth:0}}>
          <div className="serif" style={{fontSize:18,color:'var(--ink)'}}>{sectionLabel(secId)}</div>
          <Stamp style={{marginTop:2,display:'block'}}>{stats.n} {stats.n===1?'entry':'entries'}{stats.detail?` · ${stats.detail}`:''}{(comment&&comment.trim())?' · noted':''}</Stamp>
        </div>
        <CountBadge n={stats.n}/>
        <span className="serif" style={{color:'var(--muted)',fontSize:18,transform:open?'rotate(90deg)':'none',transition:'transform .15s'}}>›</span>
      </Pressable>
      {open && <div style={{padding:'6px 4px 0'}}>{body}</div>}
    </section>
  );
}

/* One person in the By-person view — drill from the name into their causes,

function SponseeReviewScreen(){
  const nav=useNav();
  const {contacts}=useContacts();
  const profile=useProfile();
  const {contactId, reviewId}=nav.params||{};
  const contact=contacts.find(c=>c.id===contactId);
  const [review,setReview]=useState(()=>{
    const all=loadSponseeReviews(); return (all[contactId]||[]).find(r=>r.reviewId===reviewId)||null;
  });
  const [mode,setMode]=useState('person'); // 'person' | 'section'
  const [sent,setSent]=useState(()=>{
    const p=loadPendingShare();
    return (p && isFeedbackLabel(p.label) && p.reviewId===reviewId) ? {blob:p.blob, key:p.key} : null;
  });
  if(!review) return (<><AppBar eyebrow="Review" title="Not found"/><ScreenBody><section style={{padding:24}}><p className="serif" style={{color:'var(--muted)',fontStyle:'italic'}}>This shared work is no longer available — it may have reached its expiry date.</p></section></ScreenBody></>);
  const left=reviewDaysLeft(review);
  const setComment=(secId,val)=>{
    const next={...review, comments:{...review.comments,[secId]:val}};
    setReview(next); updateSponseeReview(contactId, reviewId, {comments:next.comments});
  };
  const noteFor=(key)=>(review.comments&&review.comments[key])||'';
  const onNote=(key,val)=>setComment(key,val);
  const people=groupReviewByPerson(review.payload, review.steps);
  const hasPeople=people.length>0;
  const sendBack=async ()=>{
    try{
      const inner=packageReplyForSponsee(review, (profile&&profile.name)||'Your sponsor');
      const r=await buildSharePackage(inner);
      savePendingShare({blob:r.blob, key:r.key, label:'review-thoughts', contactId, reviewId});
      updateSponseeReview(contactId, reviewId, {sentBackAt:new Date().toISOString()});
      setSent(r);
    }catch(e){ alert(e.message||'Could not prepare the reply.'); }
  };
  if(sent) return (<><AppBar eyebrow="Send back" title="Feedback ready"/><ScreenBody><ShareResultView result={sent} sponsorName={contact?contact.name:'them'} label="review-thoughts" onDone={()=>nav.back()}/></ScreenBody></>);
  const effMode = hasPeople ? mode : 'section';
  return (
    <>
      <AppBar eyebrow={contact?`from ${contact.name}`:'review'} title="Shared work"/>
      <ScreenBody>
        <section style={{padding:'4px 24px 0'}}>
          <div style={{display:'flex',alignItems:'center',gap:10,padding:'10px 14px',borderRadius:10,background:left<=3?'var(--terra-soft)':'var(--paper-deep)',border:'1px solid var(--rule)'}}>
            <span style={{width:6,height:6,borderRadius:'50%',background:left<=3?'var(--terra)':'var(--muted)'}}/>
            <Stamp style={{color:left<=3?'var(--terra-ink)':'var(--muted)'}}>{left>0?`auto-deletes in ${left} day${left===1?'':'s'}`:'expired'}</Stamp>
          </div>
        </section>
        <ReviewTotalsBand steps={review.steps} payload={review.payload}/>
        {hasPeople && (
          <section style={{padding:'16px 24px 0'}}>
            <SegPills value={effMode} onChange={setMode} options={[{value:'person',label:'By person'},{value:'section',label:'By section'}]}/>
          </section>
        )}
        {effMode==='person' ? (
          <>
            <section style={{padding:'14px 24px 0'}}>
              <Stamp>Tap a name to open their causes, then drill into faults, fears and amends.</Stamp>
            </section>
            {people.map(p=>(
              <PersonReviewBlock key={p.name} person={p} comments={review.comments} onComment={setComment} noteFor={noteFor} onNote={onNote}/>
            ))}
            {/* Sections that aren't person-keyed (e.g. Exploration of fear, Defects) still shown below. */}
            {(review.steps||[]).filter(s=>!PERSON_SECTIONS.includes(s)).map(secId=>(
              <ReviewSectionBlock key={secId} secId={secId} data={review.payload&&review.payload[secId]}
                comment={review.comments&&review.comments[secId]} onComment={(v)=>setComment(secId,v)} noteFor={noteFor} onNote={onNote}/>
            ))}
          </>
        ) : (
          (review.steps||[]).map(secId=>(
            <ReviewSectionBlock key={secId} secId={secId} data={review.payload&&review.payload[secId]}
              comment={review.comments&&review.comments[secId]} onComment={(v)=>setComment(secId,v)} noteFor={noteFor} onNote={onNote}/>
          ))
        )}
        <section style={{padding:'28px 24px 36px'}}>
          <ButtonSerif primary onClick={sendBack} style={{width:'100%'}}>Send feedback back to {contact?contact.name:'them'}</ButtonSerif>
          <Stamp style={{marginTop:10,display:'block',textAlign:'center'}}>Encrypted the same way — file + a one-time key</Stamp>
        </section>
      </ScreenBody>
    </>
  );
}

/* ── F6 SHARE FLOW UI ──────────────────────────────────────────────
   Real, encrypted sponsor sharing. Replaces the old SAMPLE-data mockup.
   The sponsee picks sections, the app builds an encrypted box + one-time
   key, and offers two handoff paths: in-person (QR of the key) and remote
   (save the box file, reveal the key separately). ─────────────────────── */

/* Save the encrypted box. Desktop Chrome/Edge: a real "Save as" dialog so the
   user picks (and knows) the location. Mobile: the system share sheet. Fallback:
   a plain download to the Downloads folder. Always awaited - the UI only says
   "saved" when the save actually happened. Returns {ok, how, name}. */
async function saveShareFile(blob, label){
  const json = JSON.stringify(blob);
  const ts=new Date();
  const stamp=`${ts.getFullYear()}${String(ts.getMonth()+1).padStart(2,'0')}${String(ts.getDate()).padStart(2,'0')}-${String(ts.getHours()).padStart(2,'0')}${String(ts.getMinutes()).padStart(2,'0')}`;
  const filename=`${label}-${stamp}.swshare`;
  const bytes = new Blob([json], {type:'application/json'});

  // 1) Chromium desktop: explicit Save-as dialog (user sees exactly where it goes).
  if(window.showSaveFilePicker){
    try{
      const handle = await window.showSaveFilePicker({
        suggestedName: filename,
        types:[{description:'Encrypted step-work share (.swshare)', accept:{'application/octet-stream':['.swshare']}}],
      });
      const w = await handle.createWritable();
      await w.write(bytes); await w.close();
      return {ok:true, how:'saved', name:handle.name||filename};
    }catch(e){
      if(e && e.name==='AbortError') return {ok:false, how:'cancelled', name:filename};
      /* any other failure: fall through to a plain download */
    }
  }

  // 2) Mobile only: system share sheet - awaited, never assumed to succeed.
  const file = new File([bytes], filename, {type:'application/json'});
  const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  if(isMobile && navigator.share && navigator.canShare && navigator.canShare({files:[file]})){
    try{
      await navigator.share({files:[file], title:'Step work (encrypted)'});
      return {ok:true, how:'shared', name:filename};
    }catch(e){
      if(e && e.name==='AbortError') return {ok:false, how:'cancelled', name:filename};
      /* fall through to a plain download */
    }
  }

  // 3) Fallback: classic download into the browser's Downloads folder.
  const url=URL.createObjectURL(bytes);
  const a=document.createElement('a'); a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
  return {ok:true, how:'downloaded', name:filename};
}

/* Draw a QR for `text` into `el` as a grid of divs (no canvas — crisp at any size). */
function renderShareQR(el, text){
  if(typeof window.qrcode!=='function'){ el.textContent=''; return; }
  const qr=window.qrcode(0,'M'); qr.addData(text); qr.make();
  const n=qr.getModuleCount(); const px=Math.max(3, Math.floor(180/n));
  let html='<div style="display:inline-grid;grid-template-columns:repeat('+n+','+px+'px);grid-template-rows:repeat('+n+','+px+'px);">';
  for(let r=0;r<n;r++){ for(let c=0;c<n;c++){ html+='<div style="width:'+px+'px;height:'+px+'px;background:'+(qr.isDark(r,c)?'#1a1a1a':'#fff')+';"></div>'; } }
  html+='</div>';
  el.innerHTML=html;
}

/* Renders the share key as a QR (if the generator is loaded) plus the readable code. */
function ShareKeyCode({shareKey}){
  const ref = React.useRef(null);
  useEffect(()=>{
    if(ref.current && typeof renderShareQR==='function'){
      try{ renderShareQR(ref.current, 'SWKEY:'+shareKey); }catch(e){}
    }
  },[shareKey]);
  return (
    <div style={{textAlign:'center'}}>
      <div ref={ref} style={{display:'inline-block',background:'#fff',padding:12,borderRadius:12,border:'1px solid var(--rule)',minHeight:40}}/>
      <div className="serif" style={{marginTop:14,fontSize:26,letterSpacing:'0.08em',color:'var(--ink)',fontVariantNumeric:'tabular-nums'}}>{shareKey}</div>
      <Stamp style={{marginTop:6,display:'block'}}>the one-time key</Stamp>
    </div>
  );
}

function ShareResultView({result, sponsorName, onDone, label='for-review'}){
  const [saveMsg,setSaveMsg]=useState('');
  const [revealed,setRevealed]=useState(false);
  const confirmDone=()=>{
    if(confirm('All set? Finishing wipes the one-time key from this device for good. Make sure the file is saved AND the key has been scanned or sent. Finish now?')){ clearPendingShare(); onDone(); }
  };
  const doSave=async ()=>{
    const r=await saveShareFile(result.blob, label);
    if(r.ok && r.how==='saved')           setSaveMsg(`Saved as ${r.name}`);
    else if(r.ok && r.how==='shared')     setSaveMsg('Handed to the share sheet.');
    else if(r.ok && r.how==='downloaded') setSaveMsg(`Downloaded to your Downloads folder as ${r.name}`);
    else                                  setSaveMsg('Not saved - the dialog was closed before finishing.');
  };
  return (
    <div style={{padding:'4px 0 32px'}}>
      <section style={{padding:'0 24px'}}>
        <NoteBox>Send the <b>file</b> and the <b>key</b> by different routes. Anyone who gets only one of them can read nothing. Nothing is stored online. You can safely leave the app to send the file — this screen and key will be here when you come back. Tap Done only when {sponsorName} has both.</NoteBox>
      </section>

      <section style={{padding:'24px 24px 0'}}>
        <Eyebrow style={{marginBottom:12}}>In person</Eyebrow>
        <p className="serif" style={{fontSize:15,color:'var(--ink-2)',lineHeight:1.5,marginTop:0}}>Have {sponsorName} scan this key, then hand off the file below.</p>
        <ShareKeyCode shareKey={result.key}/>
      </section>

      <Hairline style={{margin:'28px 24px 0'}}/>

      <section style={{padding:'24px 24px 0'}}>
        <Eyebrow style={{marginBottom:12}}>Remote</Eyebrow>
        <p className="serif" style={{fontSize:15,color:'var(--ink-2)',lineHeight:1.5,marginTop:0}}>Send the encrypted file however you like (email, text). Then share the key separately — read it aloud on a call, or send it on a different app.</p>
        <ButtonSerif primary onClick={doSave} style={{width:'100%',marginTop:8}}>Save / send the encrypted file</ButtonSerif>
        {saveMsg && <Stamp style={{marginTop:10,display:'block'}}>{saveMsg}</Stamp>}
        <Pressable onClick={()=>setRevealed(r=>!r)} style={{marginTop:18,padding:'12px 0',borderTop:'1px solid var(--rule-soft)',display:'flex',alignItems:'center',gap:12}}>
          <div style={{flex:1}}>
            <Stamp>Key to send separately</Stamp>
            <div className="serif" style={{fontSize:20,letterSpacing:'0.06em',marginTop:2,filter:revealed?'none':'blur(6px)',transition:'filter .2s'}}>{result.key}</div>
          </div>
          <Stamp style={{color:'var(--terra-ink)'}}>{revealed?'hide':'reveal'}</Stamp>
        </Pressable>
      </section>

      <section style={{padding:'32px 24px 0'}}>
        <ButtonSerif onClick={confirmDone} style={{width:'100%'}}>Done</ButtonSerif>
      </section>
    </div>
  );
}

/* The sponsor's notes, section by section — used on first unlock AND in the

      {(inner.steps||[]).map(secId=>{

          .map(([k,v])=>({name:k.slice('person:'.length), note:v}))
          .filter(p=>p.note&&p.note.trim());
        // Does any record in this section carry its own note? (keys like 'item:<id>')

            {hasItemNotes && (
              <div style={{marginTop:sectionNote?12:4}}>
                {data.filter(r=>r&&r.id&&noteFor('item:'+r.id).trim())
                     .map((rec,i)=><ShareRecord key={i} secId={secId} rec={rec} noteFor={noteFor} readOnly/>)}
              </div>
            )}
          </section>
        );
      })}
      {/* Per-person notes (when the sponsor wrote on a whole name). */}
      {Object.entries(inner.comments||{}).some(([k,v])=>k.indexOf('person:')===0 && v && v.trim()) && (
        <section style={{padding:'22px 24px 0'}}>
          <h3 className="serif" style={{fontSize:20,fontWeight:400,marginBottom:8}}>Notes by person</h3>
          {Object.entries(inner.comments||{})

                <Stamp style={{color:'var(--terra-ink)'}}>{k.slice('person:'.length)}</Stamp>

              </div>
            ))}
        </section>
      )}
    </>
  );
}

  const [stage,setStage]=useState('load'); // load → key → view

  const [keyInput,setKeyInput]=useState('');

    try{ const b=JSON.parse(txt); if(b.kind!=='sponsor-share') throw new Error('bad'); setBlob(b); setStage('key'); }
    catch(e){ setErr('Could not read that file. Use the .swshare file your sponsor sent.'); } };

    try{ const got=await openSharePackage(blob, keyInput);
      if(got.dir!=='to-sponsee') throw new Error('This file is a share to send to a sponsor, not feedback for you.');
      saveSponsorFeedback(got);
      setInner(got); setStage('view'); }
    catch(e){ setErr(e.message||'Wrong key.'); } };
  return (
    <>
      <AppBar eyebrow="Sponsor" title="Feedback from sponsor"/>
      <ScreenBody>
        {stage==='load'&&(
          <section style={{padding:'4px 24px 0'}}>
            <NoteBox>Load the encrypted feedback file your sponsor sent back, then enter the one-time key they gave you.</NoteBox>

        )}
        {stage==='key'&&(
          <section style={{padding:'4px 24px 0'}}>
            <Eyebrow style={{marginBottom:8}}>One-time key</Eyebrow>

            {err&&<Stamp style={{marginTop:12,display:'block',color:'var(--terra-ink)'}}>{err}</Stamp>}
          </section>
        )}
        {stage==='view'&&inner&&(
          <>
            <section style={{padding:'4px 24px 0'}}>
              <NoteBox>Read-only. This is the work you shared with your sponsor's notes added. Nothing here changes your own saved step work. These notes are now kept under Sponsor sharing, so you can come back to them any time.</NoteBox>

}

function SponsorShareScreen(){
  const nav=useNav();
  const {steps}=useSteps();
  const {sponsor}=useContacts();
  const profile=useProfile();
  const fromName = (profile && profile.name) || 'Me';
  const sponsorName = sponsor ? sponsor.name : 'your sponsor';
  const [chosen,setChosen]=useState(()=>new Set());
  // Resume a share that was built but never confirmed Done (reload / PIN re-lock).
  const [result,setResult]=useState(()=>{
    const p=loadPendingShare();
    return (p && !isFeedbackLabel(p.label)) ? {blob:p.blob, key:p.key} : null;
  });
  const [busy,setBusy]=useState(false);

  // Only offer sections that actually have content.
  const available = SHARE_STEP_SECTIONS.filter(s=>{
    const v = steps && steps[s.id];
    if(Array.isArray(v)) return v.length>0;
    if(v && typeof v==='object') return Object.keys(v).length>0;
    return false;
  });
  const toggle=(id)=>setChosen(s=>{const n=new Set(s); n.has(id)?n.delete(id):n.add(id); return n;});

  const build=async ()=>{
    if(chosen.size===0){ alert('Choose at least one section to share.'); return; }
    setBusy(true);
    try{
      const inner = packageForSponsor(steps, [...chosen], fromName);
      const r = await buildSharePackage(inner);
      savePendingShare({blob:r.blob, key:r.key, label:'for-review'});
      setResult(r);
    }catch(e){ alert(e.message||'Could not prepare the share.'); }
    setBusy(false);
  };

  return (
    <>
      <AppBar eyebrow="Sponsor" title={result?'Share ready':`Share with ${sponsorName}`}/>
      <ScreenBody>
        {!result && (
          <>
            <section style={{padding:'4px 24px 0'}}>

                <div style={{flex:1,minWidth:0}}>
                  <div className="serif" style={{fontSize:16,color:'var(--ink)'}}>Import feedback from {sponsorName}</div>
                  <Stamp style={{marginTop:2,display:'block'}}>Load their reply file + key</Stamp>
                </div>
                <span className="serif" style={{color:'var(--muted)'}}>›</span>
              </Pressable>
            </section>
            {loadSponsorFeedback()&&(
              <section style={{padding:'14px 24px 0'}}>
                <Pressable onClick={()=>nav.push('sponsorNotes')} style={{display:'flex',alignItems:'center',gap:12,padding:'12px 16px',border:'1px solid var(--rule)',borderRadius:10,background:'var(--terra-soft)'}}>

                  <div style={{flex:1,minWidth:0}}>
                    <div className="serif" style={{fontSize:16,color:'var(--ink)'}}>Notes from {sponsorName}</div>
                    <Stamp style={{marginTop:2,display:'block'}}>From your last imported review</Stamp>
                  </div>
                  <span className="serif" style={{color:'var(--muted)'}}>›</span>
                </Pressable>

              <section style={{padding:'28px 24px'}}>
                <p className="serif" style={{fontSize:16,color:'var(--muted)',fontStyle:'italic'}}>You don't have any step work saved yet. Once you've started an inventory section, you can share it here.</p>
              </section>
            ) : (

                <Eyebrow style={{padding:'0 24px',marginBottom:8}}>Sections · {chosen.size} selected</Eyebrow>

                  <Pressable key={s.id} onClick={()=>toggle(s.id)} style={{display:'flex',alignItems:'center',gap:14,padding:'14px 24px',borderBottom:'1px solid var(--rule-soft)'}}>

/** Compact time-picker row used inside the Reminders editor. */
function MiniTimePicker({hour, minute, ampm, onChange}){
  const hours=Array.from({length:12},(_,i)=>String(i+1));
  const mins=Array.from({length:12},(_,i)=>String(i*5).padStart(2,'0'));
  const ampms=['AM','PM'];
  const setH=(v)=>onChange({hour:parseInt(v,10), minute, ampm});
  const setM=(v)=>onChange({hour, minute:parseInt(v,10), ampm});
  const setA=(v)=>onChange({hour, minute, ampm:v});
  const sel = (val, opts, on) => (
    <select value={String(val)} onChange={(e)=>on(e.target.value)}
      style={{padding:'6px 8px',background:'transparent',border:'1px solid var(--rule)',borderRadius:6,fontFamily:'Newsreader,Georgia,serif',fontSize:15,color:'var(--ink)',outline:'none',fontVariantNumeric:'oldstyle-nums'}}>
      {opts.map(o=><option key={o} value={o}>{o}</option>)}
    </select>
  );
  return (
    <div style={{display:'flex',gap:6,alignItems:'center'}}>
      {sel(hour||7, hours, setH)}
      <span className="serif" style={{color:'var(--muted)'}}>:</span>
      {sel(String(minute||0).padStart(2,'0'), mins, setM)}
      {sel(ampm||'AM', ampms, setA)}
    </div>
  );
}

function ExportScreen(){
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState('');
  const [history, setHistory] = useState(loadBackupHistory);
  const fileInputRef = useRef(null);

  const download = async ()=>{
    const pin = prompt('Enter your PIN to encrypt the backup file:');
    if(!pin) return;
    setBusy(true); setMsg('');
    try{
      // Verify PIN is the right one before encrypting
      const stored = loadPin();
      if(!stored){ throw new Error('No PIN is set. Set a PIN first in More → Security.'); }
      const hash = await sha256(stored.salt + pin);
      if(hash !== stored.hash){ throw new Error("That PIN doesn't match. Please try again."); }

      const blob = await encryptBackup(pin);
      const json = JSON.stringify(blob, null, 2);
      const bytes = new Blob([json], {type:'application/json'});
      const ts = new Date();
      const stamp = `${ts.getFullYear()}${String(ts.getMonth()+1).padStart(2,'0')}${String(ts.getDate()).padStart(2,'0')}-${String(ts.getHours()).padStart(2,'0')}${String(ts.getMinutes()).padStart(2,'0')}`;
      const filename = `stepwork-backup-${stamp}.swbak.json`;
      const url = URL.createObjectURL(bytes);
      const a = document.createElement('a');
      a.href = url; a.download = filename; a.click();
      URL.revokeObjectURL(url);
      recordBackup(filename, bytes.size);
      setHistory(loadBackupHistory());
      setMsg(`Saved ${filename} (${(bytes.size/1024).toFixed(1)} KB).`);
    }catch(e){ setMsg(e.message||'Backup failed.'); }
    setBusy(false);
  };

  const importFile = ()=>{
    if(fileInputRef.current) fileInputRef.current.click();
  };

  const handleFile = async (e)=>{
    const file = e.target.files && e.target.files[0];
    if(!file) return;
    const pin = prompt('Enter the PIN that was active when this backup was created:');
    if(!pin){ e.target.value=''; return; }
    setBusy(true); setMsg('');
    try{
      const text = await file.text();
      const blob = JSON.parse(text);
      const data = await decryptBackup(blob, pin);
      if(!confirm('Replace ALL current data on this device with the backup? This cannot be undone.')){ setBusy(false); e.target.value=''; return; }
      // Restore
      BACKUP_STORE_KEYS.forEach(k=>{
        if(data[k] !== undefined) localStorage.setItem(k, data[k]);
        else localStorage.removeItem(k);
      });
      setMsg('Restore complete. Refresh the app to see your data.');
    }catch(err){ setMsg(err.message||'Import failed.'); }
    e.target.value='';
    setBusy(false);
  };

  const clearAll = ()=>{
    if(!confirm('Permanently erase ALL data on this device? Your inventory, contacts, meetings, and journal will be gone. This cannot be undone.')) return;
    if(!confirm('Last chance. Really erase everything?')) return;
    BACKUP_STORE_KEYS.forEach(k=>localStorage.removeItem(k));
    localStorage.removeItem(BACKUP_HISTORY_KEY);
    localStorage.removeItem(PIN_KEY);
    setMsg('All data cleared. Refresh the app to start over.');
  };

  return (
    <>
      <AppBar eyebrow="Settings" title="Export & backup"/>
      <ScreenBody>
        <section style={{padding:'12px 24px 0'}}>
          <NoteBox>Backups are encrypted with your PIN. Without the PIN, the file cannot be opened — keep both safe. Save the file to a cloud folder (iCloud / Drive / Dropbox) to move between devices.</NoteBox>
        </section>
        <section style={{padding:'24px 24px 0'}}>
          <ButtonSerif primary onClick={download} style={{width:'100%'}}>{busy?'Working…':'Download encrypted backup'}</ButtonSerif>
          <ButtonSerif onClick={importFile} style={{width:'100%',marginTop:12}}>Import from backup file…</ButtonSerif>
          <input ref={fileInputRef} type="file" accept=".json,.swbak,.swbak.json,application/json" onChange={handleFile} style={{display:'none'}}/>
          {msg && <p className="serif" style={{fontSize:14,color:msg.includes('failed')||msg.includes('match')||msg.includes('Not')?'#a04030':'var(--terra-ink)',fontStyle:'italic',marginTop:14,lineHeight:1.5,textWrap:'pretty'}}>{msg}</p>}
        </section>
        <Hairline style={{margin:'28px 24px 0'}}/>
        <section style={{padding:'22px 24px 0'}}>
          <Eyebrow style={{marginBottom:14}}>Recent backups · this device</Eyebrow>
          {history.length===0 && (
            <p className="serif" style={{fontSize:14,color:'var(--muted)',fontStyle:'italic',padding:'8px 0'}}>No backups yet.</p>
          )}
          {history.map((b,i)=>{
            const d = new Date(b.when);
            const when = d.toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
            const sz = b.bytes < 1024 ? `${b.bytes} B` : `${(b.bytes/1024).toFixed(1)} KB`;
            return (
              <div key={i} style={{display:'flex',alignItems:'baseline',gap:14,padding:'12px 0',borderBottom:i<history.length-1?'1px solid var(--rule-soft)':'none'}}>
                <div className="serif" style={{flex:1,fontSize:15,lineHeight:1.3}}>{b.name}</div>
                <Stamp>{when} · {sz}</Stamp>
              </div>
            );
          })}
        </section>
        <section style={{padding:'32px 24px 28px'}}>
          <Pressable onClick={clearAll} style={{padding:'12px 0'}}>
            <span className="serif" style={{fontSize:15,color:'#a04030',fontStyle:'italic'}}>Clear all data on this device</span>
          </Pressable>
        </section>
      </ScreenBody>
    </>
  );
}

/* Small numeric PIN field for in-settings flows (the full-screen PinKeypad is for
   the lock gate; here a simple 4–6 digit input keeps the settings flow compact). */
function PinField({value,onChange,placeholder,autoFocus}){
  return (
    <input type="password" inputMode="numeric" pattern="[0-9]*" maxLength={6}
      value={value} autoFocus={autoFocus}
      onChange={e=>onChange(e.target.value.replace(/[^0-9]/g,'').slice(0,6))}

  );
}

function SecurityScreen(){
  const nav=useNav();
  // Reload the stored record after each change so the screen reflects new state.
  const [stored, setStored] = useState(loadPin);
  const hasPin = !!stored;
  const hasQ = !!(stored && stored.question);

  // mode: null | 'changePin' | 'changeQ'
  const [mode, setMode] = useState(null);
  const [cur, setCur] = useState('');
  const [p1, setP1] = useState('');
  const [p2, setP2] = useState('');
  const [q, setQ] = useState('');
  const [a, setA] = useState('');
  const [err, setErr] = useState('');
  const [busy, setBusy] = useState(false);

  const resetFields = ()=>{ setCur('');setP1('');setP2('');setQ('');setA('');setErr(''); };
  const openMode = (m)=>{ resetFields(); if(m==='changeQ' && stored && stored.question) setQ(stored.question); setMode(m); };
  const closeMode = ()=>{ resetFields(); setMode(null); };

  // Verify an entered PIN against the stored hash.
  const verifyCurrent = async ()=>{
    if(!stored) return false;
    const h = await sha256(stored.salt + cur);
    return h === stored.hash;
  };

  const submitChangePin = async ()=>{
    setErr('');
    if(cur.length<4){ setErr('Enter your current PIN.'); return; }
    if(p1.length<4){ setErr('New PIN must be 4–6 digits.'); return; }
    if(p1!==p2){ setErr("New PINs don't match — try again."); return; }
    setBusy(true);
    try{
      if(!(await verifyCurrent())){ setErr('Current PIN is incorrect.'); setBusy(false); return; }
      // New salt + hash; re-hash the existing recovery answer under the new salt so
      // recovery keeps working. (We can't recover the plaintext answer, so if a salt
      // change is needed we keep the SAME salt to preserve the stored answerHash.)
      const salt = stored.salt; // keep salt so existing answerHash stays valid
      const hash = await sha256(salt + p1);
      const next = { ...stored, version:PIN_VERSION, salt, hash };
      savePin(next); setStored(next);
      closeMode();
      alert('Your PIN has been changed.');
    }catch(e){ setErr('Something went wrong. Please try again.'); }
    setBusy(false);
  };

  const submitChangeQ = async ()=>{
    setErr('');
    if(hasPin && cur.length<4){ setErr('Enter your current PIN.'); return; }
    if(!q.trim()){ setErr('Enter a recovery question.'); return; }
    if(!a.trim()){ setErr('Enter the answer.'); return; }
    setBusy(true);
    try{
      if(hasPin && !(await verifyCurrent())){ setErr('Current PIN is incorrect.'); setBusy(false); return; }
      const salt = stored ? stored.salt : randomSalt();
      const answerHash = await sha256(salt + a.trim().toLowerCase());
      const next = { ...(stored||{version:PIN_VERSION,salt}), salt, question:q.trim(), answerHash };
      savePin(next); setStored(next);
      closeMode();
      alert('Your recovery question has been updated.');
    }catch(e){ setErr('Something went wrong. Please try again.'); }
    setBusy(false);
  };

  // ── Change PIN flow ──
  if(mode==='changePin') return (
    <>
      <AppBar eyebrow="Security" title="Change PIN" onBack={closeMode}/>
      <ScreenBody>
        <section style={{padding:'12px 24px 0'}}>
          <NoteBox>To change your PIN you must enter the current one first. If you've forgotten it, go back and use "Forgot PIN".</NoteBox>
        </section>
        <section style={{padding:'24px 24px 0'}}>
          <Eyebrow style={{marginBottom:6}}>Current PIN</Eyebrow>
          <PinField value={cur} onChange={setCur} autoFocus/>
          <div style={{marginTop:28}}><Eyebrow style={{marginBottom:6}}>New PIN</Eyebrow>
          <PinField value={p1} onChange={setP1}/></div>
          <div style={{marginTop:28}}><Eyebrow style={{marginBottom:6}}>Confirm new PIN</Eyebrow>
          <PinField value={p2} onChange={setP2}/></div>
          {err && <p className="serif" style={{color:'#a04030',fontStyle:'italic',marginTop:16,fontSize:14}}>{err}</p>}
          <div style={{marginTop:28,display:'flex',gap:12}}>
            <ButtonSerif onClick={closeMode}>Cancel</ButtonSerif>
            <ButtonSerif primary onClick={busy?undefined:submitChangePin}>{busy?'Saving…':'Save new PIN'}</ButtonSerif>
          </div>
        </section>
      </ScreenBody>
    </>
  );

  // ── Change recovery question flow ──
  if(mode==='changeQ') return (
    <>
      <AppBar eyebrow="Security" title={hasQ?'Change recovery question':'Set recovery question'} onBack={closeMode}/>
      <ScreenBody>
        <section style={{padding:'12px 24px 0'}}>
          <NoteBox>{hasPin?'Changing your recovery question requires your current PIN.':'Set a PIN first for full protection.'} The answer is stored as a one-way hash and is case-insensitive.</NoteBox>
        </section>
        <section style={{padding:'24px 24px 0'}}>
          {hasPin && (<><Eyebrow style={{marginBottom:6}}>Current PIN</Eyebrow>
          <PinField value={cur} onChange={setCur} autoFocus/></>)}
          <div style={{marginTop:hasPin?28:0}}><Eyebrow style={{marginBottom:6}}>Recovery question</Eyebrow>
          <SerifInput value={q} onChange={setQ} autoFocus={!hasPin} placeholder="e.g. What street did I grow up on?"/></div>
          <div style={{marginTop:24}}><Eyebrow style={{marginBottom:6}}>Answer</Eyebrow>
          <SerifInput value={a} onChange={setA} placeholder="Case-insensitive. Choose something only you know."/></div>
          {err && <p className="serif" style={{color:'#a04030',fontStyle:'italic',marginTop:16,fontSize:14}}>{err}</p>}
          <div style={{marginTop:28,display:'flex',gap:12}}>
            <ButtonSerif onClick={closeMode}>Cancel</ButtonSerif>
            <ButtonSerif primary onClick={busy?undefined:submitChangeQ}>{busy?'Saving…':'Save'}</ButtonSerif>
          </div>
        </section>
      </ScreenBody>
    </>
  );

  // ── Overview ──
  return (
    <>
      <AppBar eyebrow="More" title="Security"/>
      <ScreenBody>
        <section style={{padding:'12px 24px 0'}}>
          <NoteBox>Your PIN unlocks this app on this device. It is stored as a one-way hash — even we can't see it.</NoteBox>
        </section>
        <section style={{padding:'24px 24px 0'}}>
          <Eyebrow style={{marginBottom:8}}>PIN</Eyebrow>
          <div className="serif" style={{fontSize:17}}>{hasPin?'Set · asks on every open':'Not set'}</div>
          <Stamp style={{marginTop:4,display:'block'}}>Changing your PIN requires the current one.</Stamp>
          <div style={{marginTop:14,display:'flex',gap:12,flexWrap:'wrap'}}>
            <ButtonSerif onClick={()=>openMode('changePin')}>Change PIN</ButtonSerif>
          </div>
        </section>
        <Hairline style={{margin:'28px 24px 0'}}/>
        <section style={{padding:'24px 24px 40px'}}>
          <Eyebrow style={{marginBottom:8}}>Recovery question</Eyebrow>
          {hasQ
            ? <div className="serif" style={{fontSize:17,color:'var(--ink)',textWrap:'pretty'}}>{stored.question}</div>
            : <div className="serif" style={{fontSize:17,color:'var(--muted)',fontStyle:'italic'}}>Not set</div>}
          <Stamp style={{marginTop:4,display:'block'}}>{hasQ?'Shown here for reference. Used only if you forget your PIN.':'Without one, a forgotten PIN means starting over.'}</Stamp>
          <div style={{marginTop:14}}>
            <ButtonSerif onClick={()=>openMode('changeQ')}>{hasQ?'Change recovery question':'Set recovery question'}</ButtonSerif>
          </div>
        </section>
      </ScreenBody>
    </>
  );
}

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js')
      .then((reg) => {
        // If a new version is waiting, ask it to take over immediately on next page load.
        if (reg.waiting) reg.waiting.postMessage('skipWaiting');
        reg.addEventListener('updatefound', () => {
          const nw = reg.installing;
          if (!nw) return;
          nw.addEventListener('statechange', () => {
            if (nw.state === 'installed' && navigator.serviceWorker.controller) {
              nw.postMessage('skipWaiting');
            }
          });
        });
      })
      .catch((err) => console.warn('SW registration failed:', err));
  });
}
</script>
